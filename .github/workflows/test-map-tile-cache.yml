name: Verify map tile cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-map-tile-cache.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies and run tests
        run: |
          set +e
          composer install --no-interaction --prefer-dist --no-progress > map-tile-test.log 2>&1
          composer_status=$?
          cp .env.example .env >> map-tile-test.log 2>&1
          php artisan key:generate >> map-tile-test.log 2>&1
          php artisan optimize:clear >> map-tile-test.log 2>&1
          php artisan route:list --name=api.v1.map.tile >> map-tile-test.log 2>&1
          route_status=$?
          php artisan test --filter=MapTileCacheTest >> map-tile-test.log 2>&1
          test_status=$?
          echo "composer_status=$composer_status" >> map-tile-test.log
          echo "route_status=$route_status" >> map-tile-test.log
          echo "test_status=$test_status" >> map-tile-test.log
          echo "$composer_status $route_status $test_status" > map-tile-test.status

      - name: Record result
        run: |
          read composer_status route_status test_status < map-tile-test.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$composer_status" = "0" ] && [ "$route_status" = "0" ] && [ "$test_status" = "0" ]; then
            rm -f .github/workflows/test-map-tile-cache.yml map-tile-test.log map-tile-test.status
            git add -A
            git commit -m "test(map): verify server-side tile cache"
            git push origin HEAD:main
          else
            rm -f map-tile-test.status
            git add map-tile-test.log
            git commit -m "ci(map): record tile cache test failure"
            git push origin HEAD:main
            exit 1
          fi
