name: moscow_pilgrim
publish_to: none
description: Мобильное приложение пользовательской части платформы «Московский паломник».
version: 0.4.5+9

environment:
  sdk: '>=3.10.0 <4.0.0'

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/images/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  table_calendar: ^3.2.0
  qr_flutter: ^4.1.0
  maplibre: ^0.3.5
  yandex_mapkit: ^4.2.1
  webview_flutter: ^4.13.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^6.1.5
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#F7F1E8"
  adaptive_icon_foreground: assets/images/app_icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
