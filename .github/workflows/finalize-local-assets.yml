name: Finalize local frontend libraries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-local-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Download fixed library versions to public/vendor
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import re
          import shutil

          root = Path('.')
          vendor = root / 'public' / 'vendor'
          if vendor.exists():
              shutil.rmtree(vendor)
          vendor.mkdir(parents=True, exist_ok=True)
          user_agent = 'Mozilla/5.0 AppleWebKit/537.36 Chrome/150 Safari/537.36'

          def download(url: str, destination: Path, optional: bool = False):
              try:
                  request = Request(url, headers={'User-Agent': user_agent, 'Accept': '*/*'})
                  with urlopen(request, timeout=120) as response:
                      content = response.read()
                  if len(content) < 50:
                      raise RuntimeError(f'Файл слишком мал: {url}')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(content)
                  print(f'{url} -> {destination} ({len(content)} bytes)')
              except Exception:
                  if not optional:
                      raise

          bootstrap = vendor / 'bootstrap'
          download('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css', bootstrap / 'bootstrap.min.css')
          download('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css.map', bootstrap / 'bootstrap.min.css.map', True)
          download('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js', bootstrap / 'bootstrap.bundle.min.js')
          download('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js.map', bootstrap / 'bootstrap.bundle.min.js.map', True)
          download('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/LICENSE', bootstrap / 'LICENSE.txt', True)

          icons = vendor / 'bootstrap-icons'
          icons.mkdir(parents=True, exist_ok=True)
          icons_url = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css'
          request = Request(icons_url, headers={'User-Agent': user_agent, 'Accept': 'text/css,*/*'})
          with urlopen(request, timeout=120) as response:
              icons_css = response.read().decode('utf-8')
          for raw_url in sorted(set(re.findall(r'url\(([^)]+)\)', icons_css))):
              relative_url = raw_url.strip('"\'')
              if relative_url.startswith('data:'):
                  continue
              file_name = Path(urlparse(relative_url).path).name
              download(urljoin(icons_url, relative_url), icons / 'fonts' / file_name)
              icons_css = icons_css.replace(raw_url, f'"./fonts/{file_name}"')
          (icons / 'bootstrap-icons.min.css').write_text(icons_css, encoding='utf-8')
          download('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/LICENSE', icons / 'LICENSE.txt', True)

          maplibre = vendor / 'maplibre'
          download('https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css', maplibre / 'maplibre-gl.css')
          download('https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js', maplibre / 'maplibre-gl.js')
          download('https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js.map', maplibre / 'maplibre-gl.js.map', True)
          download('https://unpkg.com/maplibre-gl@5.24.0/LICENSE.txt', maplibre / 'LICENSE.txt', True)

          scanner = vendor / 'html5-qrcode'
          download('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js', scanner / 'html5-qrcode.min.js')
          download('https://unpkg.com/html5-qrcode@2.3.8/LICENSE', scanner / 'LICENSE.txt', True)

          qrcode = vendor / 'qrcodejs'
          download('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js', qrcode / 'qrcode.min.js')
          download('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/LICENSE', qrcode / 'LICENSE.txt', True)

          replacements = {
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css': "{{ asset('vendor/bootstrap/bootstrap.min.css') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js': "{{ asset('vendor/bootstrap/bootstrap.bundle.min.js') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css': "{{ asset('vendor/bootstrap-icons/bootstrap-icons.min.css') }}",
              'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js': "{{ asset('vendor/html5-qrcode/html5-qrcode.min.js') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css': "{{ asset('vendor/maplibre/maplibre-gl.css') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js': "{{ asset('vendor/maplibre/maplibre-gl.js') }}",
              'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js': "{{ asset('vendor/qrcodejs/qrcode.min.js') }}",
          }

          for path in (root / 'resources' / 'views').rglob('*.blade.php'):
              lines = path.read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if 'fonts.googleapis.com' not in line and 'fonts.gstatic.com' not in line]
              text = '\n'.join(lines) + '\n'
              for external_url, local_url in replacements.items():
                  text = text.replace(external_url, local_url)
              path.write_text(text, encoding='utf-8')

          sw_path = root / 'public' / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_VERSION = 'palomnik-v\d+';", "const CACHE_VERSION = 'palomnik-v4';", sw)
          if "'/vendor/bootstrap/bootstrap.min.css'" not in sw:
              sw = sw.replace(
                  "  '/css/pilgrim-account.css',\n",
                  "  '/css/pilgrim-account.css',\n  '/vendor/bootstrap/bootstrap.min.css',\n  '/vendor/bootstrap/bootstrap.bundle.min.js',\n  '/vendor/bootstrap-icons/bootstrap-icons.min.css',\n",
              )
          if "url.pathname.startsWith('/vendor/')" not in sw:
              sw = sw.replace(
                  "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/icons/')",
                  "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/js/')\n      || url.pathname.startsWith('/vendor/')\n      || url.pathname.startsWith('/icons/')",
              )
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Verify same-origin references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          failures = []
          external_link = re.compile(r'<link\b[^>]+href=["\']https?://', re.I)
          external_script = re.compile(r'<script\b[^>]+src=["\']https?://', re.I)
          for path in Path('resources/views').rglob('*.blade.php'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if external_link.search(line) or external_script.search(line):
                      failures.append(f'{path}:{number}: {line.strip()}')

          required = [
              'public/vendor/bootstrap/bootstrap.min.css',
              'public/vendor/bootstrap/bootstrap.bundle.min.js',
              'public/vendor/bootstrap-icons/bootstrap-icons.min.css',
              'public/vendor/maplibre/maplibre-gl.css',
              'public/vendor/maplibre/maplibre-gl.js',
              'public/vendor/html5-qrcode/html5-qrcode.min.js',
              'public/vendor/qrcodejs/qrcode.min.js',
          ]
          for value in required:
              if not Path(value).is_file():
                  failures.append(f'Отсутствует {value}')

          for path in Path('public/vendor').rglob('*.css'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'(?:@import|url\()[^\n]*https?://', text, re.I):
                  failures.append(f'{path}: осталась внешняя ссылка')

          if failures:
              raise SystemExit('\n'.join(failures))

          print('Все CSS и JavaScript загружаются с домена приложения.')
          PY

      - name: Validate Laravel
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan view:clear
          php artisan view:cache
          php artisan test --filter=HelpPageTest

      - name: Commit generated files
        run: |
          rm -f .github/workflows/finalize-local-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): serve all CSS and JavaScript locally"
          git push origin HEAD:main
