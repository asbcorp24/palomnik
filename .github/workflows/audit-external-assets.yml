name: Audit external assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-external-assets.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find external CSS and JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('resources'), Path('public')]
          patterns = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix.lower() not in {'.php', '.blade.php', '.html', '.js', '.css'} and not path.name.endswith('.blade.php'):
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if re.search(r'https?://', line) and ('.css' in line or '.js' in line or '<script' in line or '<link' in line):
                          patterns.append(f'{path}:{lineno}: {line.strip()}')
          Path('external-assets-audit.txt').write_text('\n'.join(patterns) + '\n', encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-assets-audit.txt
          git commit -m "ci: record external asset audit"
          git push origin HEAD:main
