name: Commit same-origin frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-assets-commit.yml'

permissions:
  contents: write

jobs:
  commit-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Run proven asset downloader
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/vendor-assets-final.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          script=textwrap.dedent(source[start:end])
          Path('/tmp/vendor-assets.py').write_text(script,encoding='utf-8')
          PY
          python /tmp/vendor-assets.py

      - name: Remove obsolete Google Fonts connection hints
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('resources/views').rglob('*.blade.php'):
              lines=path.read_text(encoding='utf-8').splitlines()
              lines=[line for line in lines if 'fonts.googleapis.com' not in line and 'fonts.gstatic.com' not in line]
              path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Verify all CSS JavaScript and fonts are local
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          link=re.compile(r'<link\b[^>]+href=["\']https?://',re.I)
          script=re.compile(r'<script\b[^>]+src=["\']https?://',re.I)
          for path in Path('resources/views').rglob('*.blade.php'):
              for no,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if link.search(line) or script.search(line): failures.append(f'{path}:{no}: {line.strip()}')
          for path in Path('public/vendor').rglob('*.css'):
              text=path.read_text(encoding='utf-8',errors='ignore')
              if re.search(r'(?:@import|url\()[^\n]*https?://',text,re.I): failures.append(f'{path}: external CSS URL')
          required=[
              'public/vendor/bootstrap/bootstrap.min.css',
              'public/vendor/bootstrap/bootstrap.bundle.min.js',
              'public/vendor/bootstrap-icons/bootstrap-icons.min.css',
              'public/vendor/maplibre/maplibre-gl.css',
              'public/vendor/maplibre/maplibre-gl.js',
              'public/vendor/html5-qrcode/html5-qrcode.min.js',
              'public/vendor/qrcodejs/qrcode.min.js',
              'public/vendor/fonts/palomnik-fonts.css',
          ]
          for value in required:
              if not Path(value).is_file(): failures.append(f'Missing: {value}')
          if failures: raise SystemExit('\n'.join(failures))
          print('All frontend libraries are served by the application domain.')
          PY

      - name: Validate Laravel views
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan view:clear
          php artisan view:cache
          php artisan test --filter=HelpPageTest

      - name: Commit implementation and clean diagnostics
        run: |
          rm -f \
            .github/workflows/scan-external-assets.yml \
            .github/workflows/vendor-external-assets.yml \
            .github/workflows/diagnose-vendor-assets.yml \
            .github/workflows/vendor-assets-from-source.yml \
            .github/workflows/diagnose-vendor-source.yml \
            .github/workflows/fix-vendor-assets-workflow.yml \
            .github/workflows/vendor-assets-final.yml \
            .github/workflows/diagnose-vendor-final.yml \
            .github/workflows/vendor-assets-commit.yml \
            external-assets-report.txt \
            vendor-npm.log vendor-copy.log vendor-assets-outcomes.txt \
            vendor-source-download.log vendor-source-assert.log vendor-source-outcomes.txt \
            vendor-final-download.log vendor-final-verify.log vendor-final-outcomes.txt
          git checkout -- package.json 2>/dev/null || true
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): serve all CSS JavaScript and fonts locally"
          git push origin HEAD:main
