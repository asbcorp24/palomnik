name: Finalize self-hosted frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-local-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Switch Blade templates to local bundles
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:160]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          external_common = '''    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">'''
          local_css = "    <link href=\"{{ mix('css/app.css') }}\" rel=\"stylesheet\">"

          replace_once('resources/views/site/layouts/app.blade.php', external_common, local_css)
          replace_once(
              'resources/views/site/layouts/app.blade.php',
              '<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>',
              '<script src="{{ mix(\'js/app.js\') }}"></script>',
          )

          replace_once('resources/views/admin/layouts/app.blade.php', external_common, local_css)
          replace_once(
              'resources/views/admin/layouts/app.blade.php',
              '<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>',
              '<script src="{{ mix(\'js/app.js\') }}"></script>',
          )

          replace_once('resources/views/admin/auth/login.blade.php', external_common, local_css)

          replace_once(
              'resources/views/site/map.blade.php',
              '<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">\n',
              '',
          )
          replace_once(
              'resources/views/site/map.blade.php',
              '<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>\n',
              '',
          )
          replace_once(
              'resources/views/service/tickets/scanner.blade.php',
              '<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>\n',
              '',
          )
          replace_once(
              'resources/views/site/tickets/show.blade.php',
              '<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>\n',
              '',
          )
          replace_once(
              'resources/views/welcome.blade.php',
              '        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">',
              '        <link href="{{ mix(\'css/app.css\') }}" rel="stylesheet">',
          )
          PY

      - name: Build production CSS and JavaScript
        run: npm run production

      - name: Update service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/sw.js')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r"const CACHE_VERSION = 'palomnik-v\d+';",
              "const CACHE_VERSION = 'palomnik-v4';",
              text,
              count=1,
          )

          if "  '/css/app.css'," not in text:
              text = text.replace(
                  "  '/css/pilgrim-account.css',",
                  "  '/css/pilgrim-account.css',\n  '/css/app.css',\n  '/js/app.js',",
                  1,
              )

          if "url.pathname.startsWith('/js/')" not in text:
              text = text.replace(
                  "  if (url.pathname.startsWith('/css/')",
                  "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/js/')\n      || url.pathname.startsWith('/fonts/')",
                  1,
              )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate generated local files
        run: |
          test -s public/css/app.css
          test -s public/js/app.js
          test -s public/mix-manifest.json
          test "$(find public -type f -path '*/fonts/*' | wc -l)" -gt 0
          grep -q 'bootstrap-icons' public/css/app.css
          grep -q 'maplibregl' public/css/app.css
          grep -q 'Html5QrcodeScanner' public/js/app.js
          grep -q 'QRCode' public/js/app.js

      - name: Audit external CSS and JavaScript references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('resources/views'), Path('resources/js'), Path('resources/css')]
          violations = []
          tag_pattern = re.compile(r'<(script|link)\b[^>]*(?:src|href)=["\'](https?://[^"\']+)["\'][^>]*>', re.I)
          import_pattern = re.compile(r'@import\s+(?:url\()?\s*["\']?https?://', re.I)

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php', '.js', '.css', '.html'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      for match in tag_pattern.finditer(line):
                          tag, url = match.groups()
                          lower = line.lower()
                          is_stylesheet = 'rel="stylesheet"' in lower or "rel='stylesheet'" in lower
                          if tag.lower() == 'script' or is_stylesheet or url.split('?')[0].endswith(('.css', '.js')):
                              violations.append(f'{path}:{lineno}: {url}')
                      if import_pattern.search(line):
                          violations.append(f'{path}:{lineno}: external CSS @import')

          if violations:
              print('\n'.join(violations))
              raise SystemExit('External CSS or JavaScript references remain.')

          print('All CSS and JavaScript references are local.')
          PY

      - name: Commit bundled local assets
        run: |
          rm -f \
            .github/workflows/finalize-local-assets.yml \
            .github/workflows/localize-frontend-assets.yml \
            .github/workflows/diagnose-local-assets.yml \
            .github/workflows/audit-external-assets.yml \
            external-assets-report.txt \
            local-assets-diagnostic.log \
            local-assets-outcomes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): load all CSS and JavaScript locally"
          git push origin HEAD:main
