name: Verify object hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-object-hierarchy.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare SQLite
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE='"$GITHUB_WORKSPACE"'/database/database.sqlite|' .env

      - name: Check syntax and views
        run: |
          php -l app/Models/PilgrimageObject.php
          php -l app/Services/PilgrimageObjectSearchService.php
          php -l app/Services/PilgrimageObjectFuzzySearch.php
          php -l app/Http/Controllers/Admin/PilgrimageObjectController.php
          php -l app/Http/Controllers/Site/ObjectController.php
          php -l app/Http/Controllers/Api/V1/PilgrimageObjectController.php
          php -l app/Http/Resources/PilgrimageObjectResource.php
          php -l database/migrations/2026_07_31_124500_add_parent_object_id_to_pilgrimage_objects_table.php
          php -l tests/Feature/ObjectHierarchySearchTest.php
          php artisan view:cache

      - name: Run feature tests
        run: php artisan test --filter=ObjectHierarchySearchTest

      - name: Remove workflow after success
        run: |
          rm -f .github/workflows/verify-object-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-object-hierarchy.yml
          git commit -m "test(objects): verify hierarchy search"
          git push origin HEAD:main
