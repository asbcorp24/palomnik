name: Localize Blade frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-blade-assets.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace remote executable assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css': "{{ asset('assets/vendor/bootstrap/bootstrap.min.css') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js': "{{ asset('assets/vendor/bootstrap/bootstrap.bundle.min.js') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css': "{{ asset('assets/vendor/bootstrap-icons/bootstrap-icons.min.css') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css': "{{ asset('assets/vendor/maplibre/maplibre-gl.css') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js': "{{ asset('assets/vendor/maplibre/maplibre-gl.js') }}",
              'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css': "{{ asset('assets/vendor/maplibre/maplibre-gl.css') }}",
              'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js': "{{ asset('assets/vendor/maplibre/maplibre-gl.js') }}",
              'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js': "{{ asset('assets/vendor/html5-qrcode/html5-qrcode.min.js') }}",
              'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js': "{{ asset('assets/vendor/qrcodejs/qrcode.min.js') }}",
          }

          google_markers = ('fonts.googleapis.com', 'fonts.gstatic.com')
          changed = []

          for path in Path('resources/views').rglob('*.blade.php'):
              original = path.read_text(encoding='utf-8')
              text = original

              for remote, local in replacements.items():
                  text = text.replace(remote, local)

              lines = []
              for line in text.splitlines(keepends=True):
                  if '<link' in line and any(marker in line for marker in google_markers):
                      continue
                  lines.append(line)
              text = ''.join(lines)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed Blade files:')
          print('\n'.join(changed) if changed else '(none)')

          forbidden = (
              'cdn.jsdelivr.net/npm/bootstrap@',
              'cdn.jsdelivr.net/npm/bootstrap-icons@',
              'unpkg.com/maplibre-gl@',
              'unpkg.com/html5-qrcode@',
              'cdn.jsdelivr.net/npm/qrcodejs@',
              'fonts.googleapis.com',
              'fonts.gstatic.com',
          )

          violations = []
          for path in Path('resources/views').rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              for marker in forbidden:
                  if marker in text:
                      violations.append(f'{path}: {marker}')

          if violations:
              raise SystemExit('Remote frontend links remain:\n' + '\n'.join(violations))
          PY

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo
          coverage: none

      - name: Verify Blade compilation
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan view:cache

      - name: Commit localized Blade files
        run: |
          rm -f .github/workflows/localize-blade-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(assets): use server-local frontend files in Blade"
          git push origin HEAD:main
