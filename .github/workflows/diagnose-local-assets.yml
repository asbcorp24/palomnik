name: Diagnose local asset build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-local-assets.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run diagnostic build
        run: |
          set +e
          : > local-assets-diagnostic.log

          echo '=== npm install ===' >> local-assets-diagnostic.log
          npm install --no-audit --no-fund --legacy-peer-deps >> local-assets-diagnostic.log 2>&1
          npm_status=$?
          echo "npm_status=$npm_status" >> local-assets-diagnostic.log

          echo '=== npm production build ===' >> local-assets-diagnostic.log
          npm run production >> local-assets-diagnostic.log 2>&1
          build_status=$?
          echo "build_status=$build_status" >> local-assets-diagnostic.log

          echo '=== output files ===' >> local-assets-diagnostic.log
          find public -maxdepth 4 -type f \( -path '*/css/app.css' -o -path '*/js/app.js' -o -path '*/mix-manifest.json' -o -path '*/fonts/*' \) -printf '%p %s bytes\n' >> local-assets-diagnostic.log 2>&1

          cat > local-assets-outcomes.txt <<EOF
          npm_status=$npm_status
          build_status=$build_status
          EOF

      - name: Commit diagnostic logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-assets-diagnostic.log local-assets-outcomes.txt package-lock.json public/css/app.css public/js/app.js public/mix-manifest.json public/fonts || true
          git commit -m "ci: record local asset build diagnostics"
          git push origin HEAD:main
