name: Vendor frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-frontend-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Add pinned frontend packages
        run: |
          npm install --save-dev --save-exact \
            bootstrap@5.3.3 \
            bootstrap-icons@1.11.3 \
            maplibre-gl@5 \
            html5-qrcode@2.3.8 \
            qrcodejs@1.0.0 \
            @fontsource/inter \
            @fontsource/prata \
            @fontsource/nunito

      - name: Add vendor synchronization script
        run: |
          mkdir -p scripts
          cat > scripts/sync-vendor-assets.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = path.resolve(__dirname, '..');
          const publicVendor = path.join(root, 'public', 'vendor');

          function ensureDir(directory) {
            fs.mkdirSync(directory, { recursive: true });
          }

          function copyFile(source, destination) {
            ensureDir(path.dirname(destination));
            fs.copyFileSync(source, destination);
          }

          function copyIfExists(source, destination) {
            if (fs.existsSync(source)) copyFile(source, destination);
          }

          function copyDirectory(source, destination) {
            ensureDir(destination);
            for (const entry of fs.readdirSync(source, { withFileTypes: true })) {
              const sourcePath = path.join(source, entry.name);
              const destinationPath = path.join(destination, entry.name);
              if (entry.isDirectory()) copyDirectory(sourcePath, destinationPath);
              else copyFile(sourcePath, destinationPath);
            }
          }

          fs.rmSync(publicVendor, { recursive: true, force: true });
          ensureDir(publicVendor);

          const nodeModules = path.join(root, 'node_modules');

          copyFile(
            path.join(nodeModules, 'bootstrap', 'dist', 'css', 'bootstrap.min.css'),
            path.join(publicVendor, 'bootstrap', 'bootstrap.min.css')
          );
          copyIfExists(
            path.join(nodeModules, 'bootstrap', 'dist', 'css', 'bootstrap.min.css.map'),
            path.join(publicVendor, 'bootstrap', 'bootstrap.min.css.map')
          );
          copyFile(
            path.join(nodeModules, 'bootstrap', 'dist', 'js', 'bootstrap.bundle.min.js'),
            path.join(publicVendor, 'bootstrap', 'bootstrap.bundle.min.js')
          );
          copyIfExists(
            path.join(nodeModules, 'bootstrap', 'dist', 'js', 'bootstrap.bundle.min.js.map'),
            path.join(publicVendor, 'bootstrap', 'bootstrap.bundle.min.js.map')
          );

          copyFile(
            path.join(nodeModules, 'bootstrap-icons', 'font', 'bootstrap-icons.min.css'),
            path.join(publicVendor, 'bootstrap-icons', 'bootstrap-icons.min.css')
          );
          copyDirectory(
            path.join(nodeModules, 'bootstrap-icons', 'font', 'fonts'),
            path.join(publicVendor, 'bootstrap-icons', 'fonts')
          );

          copyFile(
            path.join(nodeModules, 'maplibre-gl', 'dist', 'maplibre-gl.css'),
            path.join(publicVendor, 'maplibre-gl', 'maplibre-gl.css')
          );
          copyFile(
            path.join(nodeModules, 'maplibre-gl', 'dist', 'maplibre-gl.js'),
            path.join(publicVendor, 'maplibre-gl', 'maplibre-gl.js')
          );
          copyIfExists(
            path.join(nodeModules, 'maplibre-gl', 'dist', 'maplibre-gl.js.map'),
            path.join(publicVendor, 'maplibre-gl', 'maplibre-gl.js.map')
          );

          copyFile(
            path.join(nodeModules, 'html5-qrcode', 'html5-qrcode.min.js'),
            path.join(publicVendor, 'html5-qrcode', 'html5-qrcode.min.js')
          );
          copyFile(
            path.join(nodeModules, 'qrcodejs', 'qrcode.min.js'),
            path.join(publicVendor, 'qrcodejs', 'qrcode.min.js')
          );

          const fontOutput = path.join(publicVendor, 'fonts');
          const fontFilesOutput = path.join(fontOutput, 'files');
          ensureDir(fontFilesOutput);

          const fontSpecs = [
            { packageName: 'inter', weights: [400, 500, 600, 700] },
            { packageName: 'prata', weights: [400] },
            { packageName: 'nunito', weights: [400, 600, 700] },
          ];
          const subsetPriority = ['cyrillic-ext', 'cyrillic', 'latin-ext', 'latin'];
          const fontCss = [
            '/* Self-hosted fonts generated from @fontsource packages. */',
          ];
          const copiedFontFiles = new Set();

          for (const font of fontSpecs) {
            const packageDirectory = path.join(nodeModules, '@fontsource', font.packageName);
            for (const weight of font.weights) {
              let found = false;
              for (const subset of subsetPriority) {
                const cssPath = path.join(packageDirectory, `${subset}-${weight}.css`);
                if (!fs.existsSync(cssPath)) continue;
                found = true;
                let css = fs.readFileSync(cssPath, 'utf8');
                const matches = [...css.matchAll(/url\((?:"|')?(\.\/files\/[^)"']+)(?:"|')?\)/g)];
                for (const match of matches) {
                  const relativeSource = match[1].replace(/^\.\//, '');
                  const sourceFile = path.join(packageDirectory, relativeSource);
                  const destinationFile = path.join(fontFilesOutput, path.basename(sourceFile));
                  if (!copiedFontFiles.has(destinationFile)) {
                    copyFile(sourceFile, destinationFile);
                    copiedFontFiles.add(destinationFile);
                  }
                  css = css.split(match[1]).join(`./files/${path.basename(sourceFile)}`);
                }
                fontCss.push(`\n/* ${font.packageName} ${weight} ${subset} */\n${css.trim()}\n`);
              }
              if (!found) {
                throw new Error(`No stylesheet found for @fontsource/${font.packageName} weight ${weight}`);
              }
            }
          }
          fs.writeFileSync(path.join(fontOutput, 'palomnik-fonts.css'), fontCss.join('\n'), 'utf8');

          const licenses = [
            ['bootstrap', 'LICENSE'],
            ['bootstrap-icons', 'LICENSE.md'],
            ['maplibre-gl', 'LICENSE.txt'],
            ['html5-qrcode', 'LICENSE'],
            ['qrcodejs', 'LICENSE'],
            ['@fontsource/inter', 'LICENSE'],
            ['@fontsource/prata', 'LICENSE'],
            ['@fontsource/nunito', 'LICENSE'],
          ];
          for (const [packageName, licenseName] of licenses) {
            const source = path.join(nodeModules, ...packageName.split('/'), licenseName);
            const safeName = packageName.replace('/', '-') + '-' + licenseName.replace(/\s+/g, '-');
            copyIfExists(source, path.join(publicVendor, 'licenses', safeName));
          }

          console.log('Vendor frontend assets synchronized in public/vendor.');
          NODE

          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts = packageJson.scripts || {};
          packageJson.scripts['vendor:sync'] = 'node scripts/sync-vendor-assets.cjs';
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 4) + '\n');
          NODE

      - name: Copy dependencies into public vendor directory
        run: npm run vendor:sync

      - name: Replace external asset references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'resources/views/site/layouts/app.blade.php': [
                  ('    <link rel="preconnect" href="https://fonts.googleapis.com">\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">',
                   '    <link href="{{ asset(\'vendor/fonts/palomnik-fonts.css\') }}" rel="stylesheet">\n    <link href="{{ asset(\'vendor/bootstrap/bootstrap.min.css\') }}" rel="stylesheet">\n    <link href="{{ asset(\'vendor/bootstrap-icons/bootstrap-icons.min.css\') }}" rel="stylesheet">'),
                  ('<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>',
                   '<script src="{{ asset(\'vendor/bootstrap/bootstrap.bundle.min.js\') }}"></script>'),
              ],
              'resources/views/admin/layouts/app.blade.php': [
                  ('    <link rel="preconnect" href="https://fonts.googleapis.com">\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">',
                   '    <link href="{{ asset(\'vendor/fonts/palomnik-fonts.css\') }}" rel="stylesheet">\n    <link href="{{ asset(\'vendor/bootstrap/bootstrap.min.css\') }}" rel="stylesheet">\n    <link href="{{ asset(\'vendor/bootstrap-icons/bootstrap-icons.min.css\') }}" rel="stylesheet">'),
                  ('<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>',
                   '<script src="{{ asset(\'vendor/bootstrap/bootstrap.bundle.min.js\') }}"></script>'),
              ],
              'resources/views/admin/auth/login.blade.php': [
                  ('    <link rel="preconnect" href="https://fonts.googleapis.com">\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">',
                   '    <link href="{{ asset(\'vendor/fonts/palomnik-fonts.css\') }}" rel="stylesheet">\n    <link href="{{ asset(\'vendor/bootstrap/bootstrap.min.css\') }}" rel="stylesheet">\n    <link href="{{ asset(\'vendor/bootstrap-icons/bootstrap-icons.min.css\') }}" rel="stylesheet">'),
              ],
              'resources/views/site/map.blade.php': [
                  ('<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">',
                   '<link href="{{ asset(\'vendor/maplibre-gl/maplibre-gl.css\') }}" rel="stylesheet">'),
                  ('<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>',
                   '<script src="{{ asset(\'vendor/maplibre-gl/maplibre-gl.js\') }}"></script>'),
              ],
              'resources/views/service/tickets/scanner.blade.php': [
                  ('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>',
                   '<script src="{{ asset(\'vendor/html5-qrcode/html5-qrcode.min.js\') }}"></script>'),
              ],
              'resources/views/site/tickets/show.blade.php': [
                  ('<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>',
                   '<script src="{{ asset(\'vendor/qrcodejs/qrcode.min.js\') }}"></script>'),
              ],
              'resources/views/welcome.blade.php': [
                  ('        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">',
                   '        <link href="{{ asset(\'vendor/fonts/palomnik-fonts.css\') }}" rel="stylesheet">'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected external asset reference not found in {filename}: {old[:100]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Cache self-hosted vendor assets in service worker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/sw.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("const CACHE_VERSION = 'palomnik-v3';", "const CACHE_VERSION = 'palomnik-v4';")
          text = text.replace(
              "  '/css/pilgrim-account.css',\n  '/manifest.webmanifest',",
              "  '/css/pilgrim-account.css',\n  '/vendor/fonts/palomnik-fonts.css',\n  '/vendor/bootstrap/bootstrap.min.css',\n  '/vendor/bootstrap/bootstrap.bundle.min.js',\n  '/vendor/bootstrap-icons/bootstrap-icons.min.css',\n  '/vendor/maplibre-gl/maplibre-gl.css',\n  '/vendor/maplibre-gl/maplibre-gl.js',\n  '/vendor/html5-qrcode/html5-qrcode.min.js',\n  '/vendor/qrcodejs/qrcode.min.js',\n  '/manifest.webmanifest',"
          )
          text = text.replace(
              "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/icons/')",
              "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/vendor/')\n      || url.pathname.startsWith('/icons/')"
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Audit remaining external CSS and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('resources/views'), Path('public'), Path('resources/js'), Path('resources/css')]
          violations = []
          tag_pattern = re.compile(r'<(script|link)\b[^>]*(?:src|href)=["\'](https?://[^"\']+)["\'][^>]*>', re.I)
          import_pattern = re.compile(r'@import\s+(?:url\()?\s*["\']?https?://', re.I)

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php', '.js', '.css', '.html'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      for match in tag_pattern.finditer(line):
                          tag, url = match.groups()
                          lower = line.lower()
                          is_asset = tag.lower() == 'script' or 'rel="stylesheet"' in lower or "rel='stylesheet'" in lower or url.split('?')[0].endswith(('.css', '.js'))
                          if is_asset:
                              violations.append(f'{path}:{lineno}: {url}')
                      if import_pattern.search(line):
                          violations.append(f'{path}:{lineno}: external CSS @import')

          if violations:
              print('\n'.join(violations))
              raise SystemExit('External CSS/JS references remain.')

          print('No external CSS or JavaScript references found.')
          PY

      - name: Validate generated vendor files
        run: |
          test -s public/vendor/bootstrap/bootstrap.min.css
          test -s public/vendor/bootstrap/bootstrap.bundle.min.js
          test -s public/vendor/bootstrap-icons/bootstrap-icons.min.css
          test -s public/vendor/bootstrap-icons/fonts/bootstrap-icons.woff2
          test -s public/vendor/maplibre-gl/maplibre-gl.css
          test -s public/vendor/maplibre-gl/maplibre-gl.js
          test -s public/vendor/html5-qrcode/html5-qrcode.min.js
          test -s public/vendor/qrcodejs/qrcode.min.js
          test -s public/vendor/fonts/palomnik-fonts.css
          test "$(find public/vendor/fonts/files -type f | wc -l)" -gt 0

      - name: Validate Laravel views
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan view:cache
          php artisan test --filter=HelpPageTest
          php artisan test --filter=PilgrimagePhotoTest

      - name: Commit self-hosted assets
        run: |
          rm -f \
            .github/workflows/localize-frontend-assets.yml \
            .github/workflows/audit-external-assets.yml \
            external-assets-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): self-host all frontend CSS and JavaScript"
          git push origin HEAD:main
