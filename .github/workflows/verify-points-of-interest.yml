name: Verify linked points of interest
# verification attempt 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-points-of-interest.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install and verify
        run: |
          set +e
          : > poi-verification.log
          composer install --no-interaction --prefer-dist --no-progress >> poi-verification.log 2>&1
          composer_status=$?

          cp .env.example .env >> poi-verification.log 2>&1
          php artisan key:generate >> poi-verification.log 2>&1
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          php artisan optimize:clear >> poi-verification.log 2>&1

          php -l app/Models/PointOfInterest.php >> poi-verification.log 2>&1
          php -l app/Http/Controllers/Admin/PointOfInterestController.php >> poi-verification.log 2>&1
          php -l app/Http/Controllers/Api/V1/PointOfInterestController.php >> poi-verification.log 2>&1
          php -l app/Http/Controllers/Site/MapController.php >> poi-verification.log 2>&1
          php -l database/migrations/2026_07_31_000001_create_points_of_interest_table.php >> poi-verification.log 2>&1
          lint_status=$?

          php artisan route:list --name=points-of-interest >> poi-verification.log 2>&1
          route_status=$?

          php artisan view:cache >> poi-verification.log 2>&1
          view_status=$?

          DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan test --filter=PointOfInterestTest >> poi-verification.log 2>&1
          test_status=$?

          echo "composer_status=$composer_status" >> poi-verification.log
          echo "lint_status=$lint_status" >> poi-verification.log
          echo "route_status=$route_status" >> poi-verification.log
          echo "view_status=$view_status" >> poi-verification.log
          echo "test_status=$test_status" >> poi-verification.log
          echo "$composer_status $lint_status $route_status $view_status $test_status" > poi-verification.status

      - name: Record result
        run: |
          read composer_status lint_status route_status view_status test_status < poi-verification.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$composer_status" = "0" ] && [ "$lint_status" = "0" ] && [ "$route_status" = "0" ] && [ "$view_status" = "0" ] && [ "$test_status" = "0" ]; then
            rm -f .github/workflows/verify-points-of-interest.yml poi-verification.log poi-verification.status
            git add -A
            git commit -m "test(poi): verify linked points feature"
            git push origin HEAD:main
          else
            rm -f poi-verification.status
            git add poi-verification.log
            git commit -m "ci(poi): record linked points verification failure"
            git push origin HEAD:main
            exit 1
          fi
