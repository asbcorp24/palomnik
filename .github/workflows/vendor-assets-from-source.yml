name: Vendor frontend assets from source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-assets-from-source.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Download and localize frontend assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import hashlib
          import re
          import shutil

          ROOT = Path('.')
          VENDOR = ROOT / 'public' / 'vendor'
          USER_AGENT = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          if VENDOR.exists():
              shutil.rmtree(VENDOR)
          VENDOR.mkdir(parents=True, exist_ok=True)

          def fetch(url: str, binary: bool = True):
              request = Request(url, headers={
                  'User-Agent': USER_AGENT,
                  'Accept': '*/*',
              })
              with urlopen(request, timeout=90) as response:
                  data = response.read()
              return data if binary else data.decode('utf-8')

          def save(url: str, path: Path):
              data = fetch(url, binary=True)
              if len(data) < 100:
                  raise RuntimeError(f'Downloaded asset is unexpectedly small: {url}')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f'{url} -> {path} ({len(data)} bytes)')

          # Bootstrap 5.3.3.
          bootstrap = VENDOR / 'bootstrap'
          save('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css', bootstrap / 'bootstrap.min.css')
          save('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css.map', bootstrap / 'bootstrap.min.css.map')
          save('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js', bootstrap / 'bootstrap.bundle.min.js')
          save('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js.map', bootstrap / 'bootstrap.bundle.min.js.map')
          save('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/LICENSE', bootstrap / 'LICENSE.txt')

          # Bootstrap Icons 1.11.3; rewrite font URLs to same-origin files.
          icons = VENDOR / 'bootstrap-icons'
          icons.mkdir(parents=True, exist_ok=True)
          icons_url = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css'
          icons_css = fetch(icons_url, binary=False)
          for raw_url in sorted(set(re.findall(r'url\(([^)]+)\)', icons_css))):
              clean = raw_url.strip('"\'')
              if clean.startswith('data:'):
                  continue
              absolute = urljoin(icons_url, clean)
              file_name = Path(urlparse(clean).path).name
              save(absolute, icons / 'fonts' / file_name)
              icons_css = icons_css.replace(raw_url, f'"./fonts/{file_name}"')
          (icons / 'bootstrap-icons.min.css').write_text(icons_css, encoding='utf-8')
          save('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/LICENSE.md', icons / 'LICENSE.md')

          # MapLibre GL major version 5 is frozen locally at deployment time.
          maplibre = VENDOR / 'maplibre'
          save('https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css', maplibre / 'maplibre-gl.css')
          save('https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js', maplibre / 'maplibre-gl.js')
          try:
              save('https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js.map', maplibre / 'maplibre-gl.js.map')
          except Exception as error:
              print(f'MapLibre source map skipped: {error}')
          try:
              save('https://unpkg.com/maplibre-gl@5/LICENSE.txt', maplibre / 'LICENSE.txt')
          except Exception:
              pass

          # QR libraries.
          scanner = VENDOR / 'html5-qrcode'
          save('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js', scanner / 'html5-qrcode.min.js')
          try:
              save('https://unpkg.com/html5-qrcode@2.3.8/LICENSE', scanner / 'LICENSE.txt')
          except Exception:
              pass

          qrcode = VENDOR / 'qrcodejs'
          save('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js', qrcode / 'qrcode.min.js')
          try:
              save('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/LICENSE', qrcode / 'LICENSE.txt')
          except Exception:
              pass

          # Google Fonts are downloaded during build and rewritten to local WOFF/WOFF2 files.
          fonts = VENDOR / 'fonts'
          font_files = fonts / 'files'
          font_files.mkdir(parents=True, exist_ok=True)
          font_stylesheets = [
              'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap',
              'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap',
          ]
          localized_css = []
          remote_font_pattern = re.compile(r'url\((https://[^)]+)\)')

          for stylesheet_url in font_stylesheets:
              css_request = Request(stylesheet_url, headers={
                  'User-Agent': USER_AGENT,
                  'Accept': 'text/css,*/*;q=0.1',
              })
              with urlopen(css_request, timeout=90) as response:
                  css = response.read().decode('utf-8')

              for remote_url in sorted(set(remote_font_pattern.findall(css))):
                  suffix = Path(urlparse(remote_url).path).suffix or '.woff2'
                  file_name = hashlib.sha256(remote_url.encode('utf-8')).hexdigest()[:24] + suffix
                  destination = font_files / file_name
                  if not destination.exists():
                      save(remote_url, destination)
                  css = css.replace(remote_url, f'./files/{file_name}')
              localized_css.append(css)

          (fonts / 'palomnik-fonts.css').write_text('\n\n'.join(localized_css) + '\n', encoding='utf-8')

          replacements = {
              'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap': "{{ asset('vendor/fonts/palomnik-fonts.css') }}",
              'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap': "{{ asset('vendor/fonts/palomnik-fonts.css') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css': "{{ asset('vendor/bootstrap/bootstrap.min.css') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js': "{{ asset('vendor/bootstrap/bootstrap.bundle.min.js') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css': "{{ asset('vendor/bootstrap-icons/bootstrap-icons.min.css') }}",
              'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js': "{{ asset('vendor/html5-qrcode/html5-qrcode.min.js') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css': "{{ asset('vendor/maplibre/maplibre-gl.css') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js': "{{ asset('vendor/maplibre/maplibre-gl.js') }}",
              'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js': "{{ asset('vendor/qrcodejs/qrcode.min.js') }}",
          }

          for path in (ROOT / 'resources' / 'views').rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(
                  r'^\s*<link\s+rel=["\']preconnect["\']\s+href=["\']https://fonts\.(?:googleapis|gstatic)\.com["\'](?:\s+crossorigin)?\s*>\s*\n?',
                  '',
                  text,
                  flags=re.I | re.M,
              )
              for source, target in replacements.items():
                  text = text.replace(source, target)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          sw_path = ROOT / 'public' / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_VERSION = 'palomnik-v\d+';", "const CACHE_VERSION = 'palomnik-v4';", sw)
          if "'/vendor/fonts/palomnik-fonts.css'" not in sw:
              sw = sw.replace(
                  "  '/css/pilgrim-account.css',\n",
                  "  '/css/pilgrim-account.css',\n  '/vendor/fonts/palomnik-fonts.css',\n  '/vendor/bootstrap/bootstrap.min.css',\n  '/vendor/bootstrap/bootstrap.bundle.min.js',\n  '/vendor/bootstrap-icons/bootstrap-icons.min.css',\n",
              )
          if "url.pathname.startsWith('/vendor/')" not in sw:
              sw = sw.replace(
                  "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/icons/')",
                  "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/js/')\n      || url.pathname.startsWith('/vendor/')\n      || url.pathname.startsWith('/icons/')",
              )
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Assert no external stylesheets or scripts remain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'<link\b[^>]*?href=["\']https?://[^"\']+["\'][^>]*>', re.I),
              re.compile(r'<script\b[^>]*?src=["\']https?://[^"\']+["\'][^>]*>', re.I),
              re.compile(r'@import\s+(?:url\()?\s*["\']?https?://', re.I),
              re.compile(r'url\((?:["\']?)https?://', re.I),
          ]
          failures = []
          for root in [Path('resources'), Path('public')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php', '.css', '.js', '.html'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if any(pattern.search(line) for pattern in patterns):
                          failures.append(f'{path}:{lineno}: {line.strip()}')
          if failures:
              raise SystemExit('External frontend assets remain:\n' + '\n'.join(failures))
          print('No external CSS, JavaScript or font URLs remain.')
          PY

      - name: Validate Laravel
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan view:clear
          php artisan view:cache
          php artisan test --filter=HelpPageTest

      - name: Commit vendored assets
        run: |
          rm -f \
            .github/workflows/scan-external-assets.yml \
            .github/workflows/vendor-external-assets.yml \
            .github/workflows/diagnose-vendor-assets.yml \
            .github/workflows/vendor-assets-from-source.yml \
            external-assets-report.txt \
            vendor-npm.log \
            vendor-copy.log \
            vendor-assets-outcomes.txt
          git checkout -- package.json 2>/dev/null || true
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): serve all CSS JavaScript and fonts locally"
          git push origin HEAD:main
