name: Verify mobile hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-nearby.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run Flutter verification
        shell: bash
        run: |
          set +e
          REPORT=mobile/hierarchy-verification.txt
          : > "$REPORT"

          cd mobile
          flutter --version >> hierarchy-verification.txt 2>&1
          flutter pub get >> hierarchy-verification.txt 2>&1
          PUB_GET=$?
          dart format --output=none --set-exit-if-changed lib/src/screens/user_features.dart >> hierarchy-verification.txt 2>&1
          FORMAT=$?
          flutter analyze >> hierarchy-verification.txt 2>&1
          ANALYZE=$?
          flutter test >> hierarchy-verification.txt 2>&1
          TESTS=$?
          printf '\nRESULT pub_get=%s format=%s analyze=%s tests=%s\n' "$PUB_GET" "$FORMAT" "$ANALYZE" "$TESTS" >> hierarchy-verification.txt

      - name: Commit report and remove workflow
        run: |
          rm -f .github/workflows/apply-mobile-nearby.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/hierarchy-verification.txt .github/workflows/apply-mobile-nearby.yml
          git commit -m "test(mobile): record hierarchy verification"
          git pull --rebase origin main
          git push origin HEAD:main
