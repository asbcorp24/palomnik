name: Integrate linked points of interest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-points-of-interest.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch existing application files
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              updated = text.replace(old, new, count)
              p.write_text(updated)

          # Eloquent relationship.
          replace(
              'app/Models/PilgrimageObject.php',
              "    public function reviews(): HasMany\n    {\n        return $this->hasMany(Review::class);\n    }\n",
              "    public function reviews(): HasMany\n    {\n        return $this->hasMany(Review::class);\n    }\n\n    public function pointsOfInterest(): HasMany\n    {\n        return $this->hasMany(PointOfInterest::class)->ordered();\n    }\n\n    public function publishedPointsOfInterest(): HasMany\n    {\n        return $this->hasMany(PointOfInterest::class)->published()->ordered();\n    }\n"
          )

          # Admin object editor eager loading.
          replace(
              'app/Http/Controllers/Admin/PilgrimageObjectController.php',
              "$object->load(['objectType', 'vicariate', 'deanery', 'sanctities', 'media']);",
              "$object->load(['objectType', 'vicariate', 'deanery', 'sanctities', 'media', 'pointsOfInterest']);"
          )
          replace(
              'app/Http/Controllers/Admin/PilgrimageObjectController.php',
              "$object->load(['sanctities', 'media']);",
              "$object->load(['sanctities', 'media', 'pointsOfInterest']);"
          )

          # Admin routes.
          replace(
              'routes/web.php',
              "use App\\Http\\Controllers\\Admin\\PilgrimageObjectController as AdminPilgrimageObjectController;\n",
              "use App\\Http\\Controllers\\Admin\\PilgrimageObjectController as AdminPilgrimageObjectController;\nuse App\\Http\\Controllers\\Admin\\PointOfInterestController as AdminPointOfInterestController;\n"
          )
          replace(
              'routes/web.php',
              "        Route::resource('objects', AdminPilgrimageObjectController::class)->parameters(['objects' => 'object']);\n",
              "        Route::resource('objects', AdminPilgrimageObjectController::class)->parameters(['objects' => 'object']);\n        Route::resource('points-of-interest', AdminPointOfInterestController::class)\n            ->except('show')\n            ->parameters(['points-of-interest' => 'pointOfInterest']);\n"
          )

          # Public API routes.
          replace(
              'routes/api.php',
              "use App\\Http\\Controllers\\Api\\V1\\PilgrimageObjectController;\n",
              "use App\\Http\\Controllers\\Api\\V1\\PilgrimageObjectController;\nuse App\\Http\\Controllers\\Api\\V1\\PointOfInterestController;\n"
          )
          replace(
              'routes/api.php',
              "    Route::get('/objects', [PilgrimageObjectController::class, 'index'])->name('objects.index');\n",
              "    Route::get('/points-of-interest', [PointOfInterestController::class, 'index'])->name('points-of-interest.index');\n    Route::get('/points-of-interest/{pointOfInterest}', [PointOfInterestController::class, 'show'])\n        ->whereNumber('pointOfInterest')\n        ->name('points-of-interest.show');\n\n    Route::get('/objects', [PilgrimageObjectController::class, 'index'])->name('objects.index');\n"
          )

          # Object API includes linked POIs on details.
          replace(
              'app/Http/Controllers/Api/V1/PilgrimageObjectController.php',
              "            'media',\n        ]);",
              "            'media',\n            'publishedPointsOfInterest.pilgrimageObject',\n        ]);"
          )
          replace(
              'app/Http/Resources/PilgrimageObjectResource.php',
              "            'published_at' => optional($this->published_at)->toIso8601String(),\n",
              "            'points_of_interest' => PointOfInterestResource::collection(\n                $this->whenLoaded('publishedPointsOfInterest')\n            ),\n            'published_at' => optional($this->published_at)->toIso8601String(),\n"
          )

          # Public object page includes nearby places.
          replace(
              'app/Http/Controllers/Site/ObjectController.php',
              "            'userMedia' => fn ($query) => $query->where('status', 'published')->with('user')->latest(),\n",
              "            'userMedia' => fn ($query) => $query->where('status', 'published')->with('user')->latest(),\n            'pointsOfInterest' => fn ($query) => $query->published()->ordered(),\n"
          )

          # Site map controller data.
          replace(
              'app/Http/Controllers/Site/MapController.php',
              "use App\\Models\\PilgrimageRoute;\n",
              "use App\\Models\\PilgrimageRoute;\nuse App\\Models\\PointOfInterest;\n"
          )
          replace(
              'app/Http/Controllers/Site/MapController.php',
              "            'route' => ['nullable', 'string', 'max:255'],\n",
              "            'route' => ['nullable', 'string', 'max:255'],\n            'focus_poi' => ['nullable', 'integer', 'exists:points_of_interest,id'],\n"
          )
          replace(
              'app/Http/Controllers/Site/MapController.php',
              "        $routes = PilgrimageRoute::query()\n",
              "        $pointsOfInterest = PointOfInterest::query()\n            ->published()\n            ->with('pilgrimageObject')\n            ->whereIn('pilgrimage_object_id', $objects->pluck('id'))\n            ->ordered()\n            ->get()\n            ->map(function (PointOfInterest $point) {\n                return [\n                    'id' => $point->id,\n                    'category' => $point->category,\n                    'category_label' => $point->category_label,\n                    'icon' => $point->category_icon,\n                    'marker_color' => $point->marker_color,\n                    'name' => $point->name,\n                    'description' => $point->description,\n                    'address' => $point->address,\n                    'latitude' => (float) $point->latitude,\n                    'longitude' => (float) $point->longitude,\n                    'phone' => $point->phone,\n                    'website' => $point->website,\n                    'schedule' => $point->schedule_text,\n                    'base_object_id' => $point->pilgrimage_object_id,\n                    'base_object_name' => optional($point->pilgrimageObject)->name,\n                    'base_object_url' => $point->pilgrimageObject ? route('objects.show', $point->pilgrimageObject) : null,\n                ];\n            })\n            ->values();\n\n        $focusedPointOfInterest = $pointsOfInterest->firstWhere('id', (int) ($filters['focus_poi'] ?? 0));\n\n        $routes = PilgrimageRoute::query()\n"
          )
          replace(
              'app/Http/Controllers/Site/MapController.php',
              "            'selectedRoute' => $selectedRoute,\n",
              "            'selectedRoute' => $selectedRoute,\n            'pointsOfInterest' => $pointsOfInterest,\n            'focusedPointOfInterest' => $focusedPointOfInterest,\n            'poiCategories' => PointOfInterest::CATEGORIES,\n"
          )

          # Admin navigation.
          replace(
              'resources/views/admin/layouts/app.blade.php',
              "            <a class=\"sidebar-link {{ request()->routeIs('admin.objects.*') || request()->routeIs('admin.media.*') ? 'active' : '' }}\" href=\"{{ route('admin.objects.index') }}\"><i class=\"bi bi-geo-alt\"></i><span>Храмы и объекты</span></a>\n",
              "            <a class=\"sidebar-link {{ request()->routeIs('admin.objects.*') || request()->routeIs('admin.media.*') ? 'active' : '' }}\" href=\"{{ route('admin.objects.index') }}\"><i class=\"bi bi-geo-alt\"></i><span>Храмы и объекты</span></a>\n            <a class=\"sidebar-link {{ request()->routeIs('admin.points-of-interest.*') ? 'active' : '' }}\" href=\"{{ route('admin.points-of-interest.index') }}\"><i class=\"bi bi-pin-map-fill\"></i><span>Точки интереса</span></a>\n"
          )

          # Related POIs in object editor.
          replace(
              'resources/views/admin/objects/form.blade.php',
              "    </div>\n@endif\n@endsection\n",
              "    </div>\n    @include('admin.objects._points_of_interest')\n@endif\n@endsection\n"
          )

          # Related POIs on public object page.
          replace(
              'resources/views/site/objects/show.blade.php',
              "                @if($officialImages->isNotEmpty())\n",
              "                @include('site.objects._points_of_interest')\n\n                @if($officialImages->isNotEmpty())\n"
          )

          # Map sidebar controls.
          replace(
              'resources/views/site/map.blade.php',
              "        <div class=\"small text-secondary mb-3\">Объектов на карте: <strong class=\"text-dark\">{{ $objects->count() }}</strong></div>\n",
              "        <div class=\"info-card p-3 mb-4\">\n            <div class=\"small fw-semibold mb-2\"><i class=\"bi bi-pin-map-fill me-2\"></i>Точки интереса рядом</div>\n            <div class=\"d-grid gap-2\">\n                @foreach($poiCategories as $key => $category)\n                    <label class=\"d-flex align-items-center gap-2 small\">\n                        <input class=\"form-check-input mt-0\" type=\"checkbox\" data-poi-category value=\"{{ $key }}\" checked>\n                        <i class=\"bi {{ $category['icon'] }}\" style=\"color:{{ $category['color'] }}\"></i>\n                        <span>{{ $category['label'] }}</span>\n                    </label>\n                @endforeach\n            </div>\n            <div class=\"small text-secondary mt-2\">Точек: <strong>{{ $pointsOfInterest->count() }}</strong>. Каждая привязана к храму или другому базовому объекту.</div>\n        </div>\n\n        <div class=\"small text-secondary mb-3\">Объектов на карте: <strong class=\"text-dark\">{{ $objects->count() }}</strong></div>\n"
          )

          # Map JS variables.
          replace(
              'resources/views/site/map.blade.php',
              "    const selectedRoute = @json($selectedRoute, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);\n    const objectIndex = new Map(objects.map(item => [String(item.id), item]));\n",
              "    const selectedRoute = @json($selectedRoute, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);\n    const pointsOfInterest = @json($pointsOfInterest, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);\n    const focusedPointOfInterest = @json($focusedPointOfInterest, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);\n    const objectIndex = new Map(objects.map(item => [String(item.id), item]));\n    const pointOfInterestIndex = new Map(pointsOfInterest.map(item => [String(item.id), item]));\n"
          )
          replace(
              'resources/views/site/map.blade.php',
              "    const map = new maplibregl.Map({\n",
              "    const poiGeojson = {\n        type: 'FeatureCollection',\n        features: pointsOfInterest\n            .filter(item => Number.isFinite(Number(item.latitude)) && Number.isFinite(Number(item.longitude)))\n            .map(item => ({\n                type: 'Feature',\n                geometry: {type: 'Point', coordinates: [Number(item.longitude), Number(item.latitude)]},\n                properties: {\n                    id: String(item.id),\n                    category: item.category,\n                    marker_color: item.marker_color || '#7c3aed'\n                }\n            }))\n    };\n\n    const map = new maplibregl.Map({\n"
          )

          # POI popup helpers.
          replace(
              'resources/views/site/map.blade.php',
              "    map.on('load', () => {\n",
              "    function pointOfInterestPopupHtml(item) {\n        const description = item.description ? `<div class=\"small text-secondary mb-2\">${escapeHtml(item.description)}</div>` : '';\n        const schedule = item.schedule ? `<div class=\"small text-secondary mb-2\"><i class=\"bi bi-clock me-1\"></i>${escapeHtml(item.schedule)}</div>` : '';\n        const website = item.website ? `<a class=\"btn btn-sm btn-light\" href=\"${escapeHtml(item.website)}\" target=\"_blank\" rel=\"noopener\">Сайт</a>` : '';\n        return `<article class=\"map-popup\"><div class=\"map-popup-body\"><div class=\"small fw-semibold mb-1\" style=\"color:${escapeHtml(item.marker_color)}\">${escapeHtml(item.category_label)}</div><div class=\"fw-bold mb-2\">${escapeHtml(item.name)}</div>${description}<div class=\"small text-secondary mb-2\"><i class=\"bi bi-geo-alt me-1\"></i>${escapeHtml(item.address)}</div>${schedule}<div class=\"small mb-3\">Рядом с: <strong>${escapeHtml(item.base_object_name || '')}</strong></div><div class=\"d-flex gap-2 flex-wrap\"><a class=\"btn btn-sm btn-pm-green\" href=\"${escapeHtml(item.base_object_url || '#')}\">Открыть объект</a>${website}</div></div></article>`;\n    }\n\n    function showPointOfInterest(item) {\n        map.easeTo({center:[Number(item.longitude), Number(item.latitude)], zoom:16});\n        new maplibregl.Popup({offset:18, maxWidth:'330px'})\n            .setLngLat([Number(item.longitude), Number(item.latitude)])\n            .setHTML(pointOfInterestPopupHtml(item))\n            .addTo(map);\n    }\n\n    map.on('load', () => {\n"
          )

          # POI source and layer before optional raster layers.
          replace(
              'resources/views/site/map.blade.php',
              "        if (satelliteUrl) {\n",
              "        map.addSource('points-of-interest', {\n            type:'geojson',\n            data:poiGeojson\n        });\n\n        map.addLayer({\n            id:'points-of-interest',\n            type:'circle',\n            source:'points-of-interest',\n            paint:{\n                'circle-color':['coalesce',['get','marker_color'],'#7c3aed'],\n                'circle-radius':7,\n                'circle-stroke-width':2.5,\n                'circle-stroke-color':'#fffdf9'\n            }\n        });\n\n        if (satelliteUrl) {\n"
          )

          # Focus a requested POI.
          replace(
              'resources/views/site/map.blade.php',
              "        if (selectedRoute?.points?.length >= 2) {\n",
              "        if (focusedPointOfInterest) {\n            window.setTimeout(() => showPointOfInterest(focusedPointOfInterest), 150);\n        }\n\n        if (selectedRoute?.points?.length >= 2) {\n"
          )

          # POI click and cursor behavior.
          replace(
              'resources/views/site/map.blade.php',
              "    ['pilgrim-clusters','pilgrim-points'].forEach(layer => {\n",
              "    map.on('click', 'points-of-interest', event => {\n        const feature = event.features?.[0];\n        if (!feature) return;\n        const item = pointOfInterestIndex.get(String(feature.properties.id));\n        if (item) showPointOfInterest(item);\n    });\n\n    ['pilgrim-clusters','pilgrim-points','points-of-interest'].forEach(layer => {\n"
          )

          # Client-side category visibility filters.
          replace(
              'resources/views/site/map.blade.php',
              "    document.addEventListener('click', event => {\n",
              "    document.querySelectorAll('[data-poi-category]').forEach(input => input.addEventListener('change', () => {\n        if (!map.getLayer('points-of-interest')) return;\n        const selected = Array.from(document.querySelectorAll('[data-poi-category]:checked')).map(item => item.value);\n        map.setFilter('points-of-interest', selected.length ? ['in', ['get','category'], ['literal', selected]] : ['==', ['get','category'], '__none__']);\n    }));\n\n    document.addEventListener('click', event => {\n"
          )

          # README summary and API endpoint.
          replace(
              'README.md',
              "- необязательные спутниковый и исторический растровые слои;\n",
              "- необязательные спутниковый и исторический растровые слои;\n- связанные точки интереса: стоянки, кафе, гостиницы и полезные места рядом с базовыми объектами;\n"
          )
          replace(
              'README.md',
              "GET  /api/v1/map/style.json\n",
              "GET  /api/v1/map/style.json\nGET  /api/v1/points-of-interest\nGET  /api/v1/points-of-interest/{id}\n"
          )
          PY

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies and verify
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan route:list --name=points-of-interest
          php artisan test --filter=PointOfInterestTest

      - name: Commit integrated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/implement-points-of-interest.yml
          git add -A
          git commit -m "feat(poi): add linked nearby places to admin API and map"
          git push origin HEAD:main
