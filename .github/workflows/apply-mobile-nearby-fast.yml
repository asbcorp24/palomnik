name: Apply mobile nearby section fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-nearby-fast.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mobile source change
        run: |
          git pull --rebase origin main
          if ! grep -q "final nearby = _list(item\['nearby'\])" mobile/lib/src/screens/user_features.dart; then
            echo '' | base64 -d | gzip -d > /tmp/mobile-nearby.py
            python3 /tmp/mobile-nearby.py
          fi
          dart format mobile/lib/src/screens/user_features.dart || true

      - name: Commit source
        run: |
          rm -f .github/workflows/apply-mobile-nearby-fast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/src/screens/user_features.dart .github/workflows/apply-mobile-nearby-fast.yml
          git commit -m "feat(mobile): show hierarchy and nearby places"
          git pull --rebase origin main
          git push origin HEAD:main
