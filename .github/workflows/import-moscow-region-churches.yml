          PHP

          cat > database/seeders/MoscowRegionChurchSeeder.php <<'PHP'
          <?php

          namespace Database\Seeders;

          use App\Models\ObjectType;
          use App\Models\PilgrimageObject;
          use Illuminate\Database\Seeder;
          use Illuminate\Support\Str;
          use JsonException;
          use RuntimeException;

          class MoscowRegionChurchSeeder extends Seeder
          {
              /** @throws JsonException */
              public function run(): void
              {
                  $path = database_path('seeders/data/moscow-region-orthodox-places.json');
                  if (! is_file($path)) {
                      throw new RuntimeException('Не найден снимок храмов: '.$path);
                  }

                  $snapshot = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                  $objects = $snapshot['objects'] ?? [];
                  $typeIds = ObjectType::query()
                      ->whereIn('slug', ['temple', 'monastery', 'chapel'])
                      ->pluck('id', 'slug');

                  foreach (['temple', 'monastery', 'chapel'] as $requiredType) {
                      if (! $typeIds->has($requiredType)) {
                          throw new RuntimeException('Перед импортом запустите CatalogSeeder: отсутствует тип '.$requiredType);
                      }
                  }

                  foreach ($objects as $item) {
                      $sourceId = (string) $item['source_id'];
                      $object = PilgrimageObject::withTrashed()
                          ->where('source', 'openstreetmap')
                          ->where('source_id', $sourceId)
                          ->first();

                      // Удалённые администратором записи не восстанавливаем автоматически.
                      if ($object?->trashed()) {
                          continue;
                      }

                      $payload = [
                          'object_type_id' => $typeIds[(string) $item['type']],
                          'source' => 'openstreetmap',
                          'source_id' => $sourceId,
                          'name' => (string) $item['name'],
                          'address' => (string) $item['address'],
                          'latitude' => (float) $item['latitude'],
                          'longitude' => (float) $item['longitude'],
                          'phone' => $item['phone'] ?: null,
                          'email' => $item['email'] ?: null,
                          'website' => $item['website'] ?: null,
                          'schedule_text' => $item['schedule_text'] ?: null,
                          'is_published' => true,
                          'published_at' => now(),
                      ];

                      if (! $object) {
                          $payload['slug'] = $this->uniqueSlug((string) $item['name'], $sourceId);
                          PilgrimageObject::query()->create($payload);
                          continue;
                      }

                      // Координаты и тип синхронизируем; редакционные поля не затираем.
                      $updates = [
                          'object_type_id' => $payload['object_type_id'],
                          'latitude' => $payload['latitude'],
                          'longitude' => $payload['longitude'],
                      ];
                      foreach (['name', 'address', 'phone', 'email', 'website', 'schedule_text'] as $field) {
                          if (blank($object->{$field}) && filled($payload[$field])) {
                              $updates[$field] = $payload[$field];
                          }
                      }
                      $object->update($updates);
                  }
              }

              private function uniqueSlug(string $name, string $sourceId): string
              {
                  $suffix = str_replace('/', '-', $sourceId);
                  $base = Str::slug($name);
                  $base = Str::limit($base !== '' ? $base : 'pravoslavnyy-obekt', 180, '');
                  $candidate = $base.'-osm-'.$suffix;
                  $counter = 2;

                  while (PilgrimageObject::withTrashed()->where('slug', $candidate)->exists()) {
                      $candidate = $base.'-osm-'.$suffix.'-'.$counter++;
                  }

                  return $candidate;
              }
          }
          PHP

          cat > tests/Feature/MoscowRegionChurchSeederTest.php <<'PHP'
          <?php

          namespace Tests\Feature;

          use App\Models\PilgrimageObject;
          use Database\Seeders\CatalogSeeder;
          use Database\Seeders\MoscowRegionChurchSeeder;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Tests\TestCase;

          class MoscowRegionChurchSeederTest extends TestCase
          {
              use RefreshDatabase;

              public function test_snapshot_imports_many_unique_published_places(): void
              {
                  $this->seed([CatalogSeeder::class, MoscowRegionChurchSeeder::class]);

                  $query = PilgrimageObject::query()->where('source', 'openstreetmap');
                  $count = $query->count();

                  $this->assertGreaterThan(100, $count);
                  $this->assertSame($count, $query->distinct()->count('source_id'));
                  $this->assertSame(0, $query->where('is_published', false)->count());
                  $this->assertGreaterThan(0, $query->whereHas('objectType', fn ($q) => $q->where('slug', 'temple'))->count());
                  $this->assertGreaterThan(0, $query->whereHas('objectType', fn ($q) => $q->where('slug', 'monastery'))->count());
                  $this->assertGreaterThan(0, $query->whereHas('objectType', fn ($q) => $q->where('slug', 'chapel'))->count());
              }
          }
          PHP

          cat > docs/osm-church-import.md <<'MD'
          # Импорт храмов Москвы и Московской области

          Снимок `database/seeders/data/moscow-region-orthodox-places.json` формируется из OpenStreetMap через Overpass API.

          В импорт входят именованные действующие православные храмы, соборы, часовни и монастыри в регионах `RU-MOW` и `RU-MOS`. Явно не православные конфессии, строящиеся, заброшенные и разрушенные объекты исключаются. Близкие дубли «точка + контур здания» объединяются.

          Обновить снимок:

          ```bash
          python3 scripts/fetch_moscow_region_churches.py
          php artisan db:seed --class=MoscowRegionChurchSeeder
          ```

          Seeder идентифицирует записи по паре `source=openstreetmap` и `source_id=node|way|relation/id`. Удалённые администратором записи не восстанавливаются, заполненные редакционные поля повторным импортом не перезаписываются.

          Данные: © OpenStreetMap contributors, лицензия ODbL 1.0.
          MD

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Anchor not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/Models/PilgrimageObject.php',
              "        'parent_object_id',\n",
              "        'parent_object_id',\n        'source',\n        'source_id',\n",
          )
          replace_once(
              'database/seeders/DatabaseSeeder.php',
              "            CatalogSeeder::class,\n",
              "            CatalogSeeder::class,\n            MoscowRegionChurchSeeder::class,\n",
          )
          replace_once(
              'resources/views/site/layouts/app.blade.php',
              '<span>© {{ date(\'Y\') }} Московский паломник</span>',
              '<span>© {{ date(\'Y\') }} Московский паломник · Данные объектов: <a class="footer-link" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></span>',
          )
          PY

      - name: Download and normalize OpenStreetMap data
        run: python3 scripts/fetch_moscow_region_churches.py

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify migration, seeder and views
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          php artisan migrate:fresh --force
          php artisan db:seed --class=CatalogSeeder --force
          php artisan db:seed --class=MoscowRegionChurchSeeder --force
          php artisan view:cache
          php artisan test --filter=MoscowRegionChurchSeederTest
          php -l database/seeders/MoscowRegionChurchSeeder.php
          php -l database/migrations/2026_07_31_143000_add_external_source_to_pilgrimage_objects_table.php

      - name: Commit imported snapshot
        shell: bash
        run: |
          rm -f .github/workflows/import-moscow-region-churches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(seed): import Moscow region Orthodox places"
          git push origin HEAD:main
