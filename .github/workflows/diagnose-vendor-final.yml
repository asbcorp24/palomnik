name: Diagnose final asset build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-vendor-final.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract workflow scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/vendor-assets-final.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          blocks=[]; pos=0
          while True:
              try: start=source.index(marker,pos)+len(marker)
              except ValueError: break
              end=source.index("\n          PY",start)
              blocks.append(textwrap.dedent(source[start:end])); pos=end+1
          Path('/tmp/final-download.py').write_text(blocks[0],encoding='utf-8')
          Path('/tmp/final-verify.py').write_text(blocks[1],encoding='utf-8')
          PY
      - name: Run download
        id: download
        continue-on-error: true
        run: python /tmp/final-download.py > vendor-final-download.log 2>&1
      - name: Run verify
        id: verify
        continue-on-error: true
        run: python /tmp/final-verify.py > vendor-final-verify.log 2>&1
      - name: Commit diagnostics
        run: |
          printf 'download=%s\nverify=%s\n' '${{ steps.download.outcome }}' '${{ steps.verify.outcome }}' > vendor-final-outcomes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor-final-download.log vendor-final-verify.log vendor-final-outcomes.txt
          git commit -m "ci: record final asset build diagnostics"
          git push origin HEAD:main
