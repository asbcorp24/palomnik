name: Localize frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-frontend-assets.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Install local frontend dependencies
        run: |
          npm install --save-dev \
            bootstrap@5.3.3 \
            bootstrap-icons@1.11.3 \
            @fontsource/inter \
            @fontsource/prata \
            maplibre-gl@5

      - name: Configure Laravel Mix
        run: |
          cat > webpack.mix.js <<'EOF'
          const mix = require('laravel-mix');

          mix.js('resources/js/app.js', 'public/js')
              .styles([
                  'node_modules/bootstrap/dist/css/bootstrap.min.css',
                  'node_modules/bootstrap-icons/font/bootstrap-icons.min.css',
                  'node_modules/@fontsource/inter/400.css',
                  'node_modules/@fontsource/inter/500.css',
                  'node_modules/@fontsource/inter/600.css',
                  'node_modules/@fontsource/inter/700.css',
                  'node_modules/@fontsource/prata/400.css',
                  'node_modules/maplibre-gl/dist/maplibre-gl.css',
                  'resources/css/app.css',
              ], 'public/css/app.css')
              .copyDirectory('node_modules/bootstrap-icons/font/fonts', 'public/css/fonts')
              .copyDirectory('node_modules/@fontsource/inter/files', 'public/css/files')
              .copyDirectory('node_modules/@fontsource/prata/files', 'public/css/files')
              .version();
          EOF

          cat > resources/js/app.js <<'EOF'
          require('./bootstrap');
          require('bootstrap/dist/js/bootstrap.bundle.min.js');

          window.maplibregl = require('maplibre-gl');
          EOF

      - name: Replace CDN references in Blade templates
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          bootstrap_css = '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">'
          icons_css = '<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">'
          bootstrap_js = '<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>'
          local_css = '<link href="{{ mix(\'css/app.css\') }}" rel="stylesheet">'
          local_js = '<script src="{{ mix(\'js/app.js\') }}"></script>'

          for path in Path('resources/views').rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(r'^\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*\n?', '', text, flags=re.M)
              text = re.sub(r'^\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*\n?', '', text, flags=re.M)
              text = re.sub(r'^\s*<link href="https://fonts\.googleapis\.com/[^\"]+" rel="stylesheet">\s*\n?', '', text, flags=re.M)

              if bootstrap_css in text:
                  text = text.replace(bootstrap_css, local_css, 1)
              elif icons_css in text and local_css not in text:
                  text = text.replace(icons_css, local_css, 1)

              text = text.replace(icons_css, '')
              text = text.replace(bootstrap_js, local_js)

              # MapLibre is exposed globally from the local app.js bundle and its CSS is in app.css.
              text = re.sub(r'^\s*<link href="https://unpkg\.com/maplibre-gl@[^\"]+/dist/maplibre-gl\.css" rel="stylesheet">\s*\n?', '', text, flags=re.M)
              text = re.sub(r'^\s*<script src="https://unpkg\.com/maplibre-gl@[^\"]+/dist/maplibre-gl\.js"></script>\s*\n?', '', text, flags=re.M)

              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Build production assets
        run: npm run production

      - name: Verify no external executable assets remain
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          violations = []
          tag_pattern = re.compile(r'<(?:script|link)\b[^>]*(?:src|href)=["\'](https?://[^"\']+)["\'][^>]*>', re.I)

          for path in Path('resources/views').rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              for match in tag_pattern.finditer(text):
                  violations.append(f'{path}: {match.group(1)}')

          if violations:
              print('External script/style resources remain:')
              print('\n'.join(violations))
              sys.exit(1)

          required = [
              Path('public/css/app.css'),
              Path('public/js/app.js'),
              Path('public/mix-manifest.json'),
              Path('public/css/fonts/bootstrap-icons.woff2'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              print('Missing built assets: ' + ', '.join(missing))
              sys.exit(1)
          PY

      - name: Commit localized assets
        run: |
          rm -f .github/workflows/localize-frontend-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(csp): serve frontend dependencies locally"
          git push origin HEAD:main
