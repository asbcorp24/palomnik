                          isExpanded: true,
                          decoration: const InputDecoration(labelText: 'Паломнический маршрут'),
                          items: _routes.map((route) => DropdownMenuItem<int>(value: route['id'] as int, child: Text('${route['title']}', overflow: TextOverflow.ellipsis))).toList(),
                          onChanged: (value) => setDialogState(() => routeId = value),
                        ),
                        SwitchListTile.adaptive(
                          contentPadding: EdgeInsets.zero,
                          value: publish,
                          title: const Text('Опубликовать на общем сайте'),
                          subtitle: const Text('После проверки модератором'),
                          onChanged: (value) => setDialogState(() => publish = value),
                        ),
                        if (publish && routeId == null) const Text('Для публикации выберите маршрут.', style: TextStyle(color: Colors.red, fontSize: 12)),
                      ]),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Отмена')),
                      FilledButton(onPressed: publish && routeId == null ? null : () => Navigator.pop(dialogContext, true), child: const Text('Загрузить')),
                    ],
                  ),
                ),
              );

              if (accepted != true) {
                title.dispose();
                description.dispose();
                return;
              }

              setState(() => _uploading = true);
              try {
                final form = FormData.fromMap({
                  'file': await MultipartFile.fromFile(file.path, filename: file.name),
                  'title': title.text.trim().isEmpty ? null : title.text.trim(),
                  'description': description.text.trim().isEmpty ? null : description.text.trim(),
                  'pilgrimage_route_id': routeId,
                  'request_publication': publish,
                });
                await ApiClient.instance.dio.post('/mobile/media', data: form);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(publish ? 'Фото отправлено на модерацию.' : 'Фото сохранено только для вас.')));
                  setState(() {});
                }
              } catch (error) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(ApiClient.instance.messageFrom(error)), backgroundColor: Colors.red));
              } finally {
                title.dispose();
                description.dispose();
                if (mounted) setState(() => _uploading = false);
              }
            }

            Future<void> _requestPublication(Map<String, dynamic> item) async {
              final currentRoute = item['route'] is Map ? Map<String, dynamic>.from(item['route'] as Map) : const <String, dynamic>{};
              int? routeId = currentRoute['id'] as int?;
              final accepted = await showDialog<bool>(
                context: context,
                builder: (dialogContext) => StatefulBuilder(
                  builder: (context, setDialogState) => AlertDialog(
                    title: const Text('Отправить на публикацию'),
                    content: DropdownButtonFormField<int>(
                      value: routeId,
                      isExpanded: true,
                      decoration: const InputDecoration(labelText: 'Паломнический маршрут'),
                      items: _routes.map((route) => DropdownMenuItem<int>(value: route['id'] as int, child: Text('${route['title']}', overflow: TextOverflow.ellipsis))).toList(),
                      onChanged: (value) => setDialogState(() => routeId = value),
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Отмена')),
                      FilledButton(onPressed: routeId == null ? null : () => Navigator.pop(dialogContext, true), child: const Text('На модерацию')),
                    ],
                  ),
                ),
              );
              if (accepted != true || routeId == null) return;
              try {
                await ApiClient.instance.dio.post('/mobile/media/${item['id']}/publication', data: {'pilgrimage_route_id': routeId});
                if (mounted) setState(() {});
              } catch (error) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(ApiClient.instance.messageFrom(error)), backgroundColor: Colors.red));
              }
            }

            Future<void> _withdraw(Map<String, dynamic> item) async {
              await ApiClient.instance.dio.delete('/mobile/media/${item['id']}/publication');
              if (mounted) setState(() {});
            }

            Future<void> _delete(Map<String, dynamic> item) async {
              await ApiClient.instance.dio.delete('/mobile/media/${item['id']}');
              if (mounted) setState(() {});
            }

            String _statusLabel(String? status) => switch (status) {
                  'private' => 'Только мне',
                  'pending' => 'На модерации',
                  'published' => 'Опубликовано',
                  'rejected' => 'Отклонено',
                  _ => status ?? '',
                };

            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(title: const Text('Паломнические фото')),
                  floatingActionButton: FloatingActionButton.extended(
                    onPressed: _uploading
                        ? null
                        : () => showModalBottomSheet<void>(
                              context: context,
                              builder: (context) => SafeArea(
                                child: Wrap(children: [
                                  ListTile(leading: const Icon(Icons.photo_camera), title: const Text('Сделать фотографию'), onTap: () { Navigator.pop(context); _upload(ImageSource.camera); }),
                                  ListTile(leading: const Icon(Icons.photo_library), title: const Text('Выбрать из галереи'), onTap: () { Navigator.pop(context); _upload(ImageSource.gallery); }),
                                ]),
                              ),
                            ),
                    icon: _uploading ? const SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2)) : const Icon(Icons.add_a_photo),
                    label: Text(_uploading ? 'Загрузка' : 'Добавить'),
                  ),
                  body: FutureBuilder<List<Map<String, dynamic>>>(
                    future: _load(),
                    builder: (context, snapshot) {
                      if (snapshot.connectionState != ConnectionState.done) return const Center(child: CircularProgressIndicator());
                      if (snapshot.hasError) return FeatureError(error: snapshot.error!, onRetry: () => setState(() {}));
                      final photos = snapshot.data!;
                      if (photos.isEmpty) return const Center(child: Text('Паломнических фотографий пока нет.'));
                      return RefreshIndicator(
                        onRefresh: () async => setState(() {}),
                        child: GridView.builder(
                          padding: const EdgeInsets.fromLTRB(12, 12, 12, 90),
                          gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 2, mainAxisSpacing: 10, crossAxisSpacing: 10, childAspectRatio: .68),
                          itemCount: photos.length,
                          itemBuilder: (context, index) {
                            final item = photos[index];
                            final route = item['route'] is Map ? Map<String, dynamic>.from(item['route'] as Map) : const <String, dynamic>{};
                            final status = '${item['status'] ?? 'private'}';
                            return Card(
                              clipBehavior: Clip.antiAlias,
                              child: Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: [
                                Expanded(child: Image.network('${item['url']}', fit: BoxFit.cover, errorBuilder: (_, __, ___) => const Icon(Icons.broken_image))),
                                Padding(
                                  padding: const EdgeInsets.all(9),
                                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                    Text('${item['title'] ?? 'Паломническое фото'}', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w600)),
                                    const SizedBox(height: 3),
                                    Text(_statusLabel(status), style: const TextStyle(fontSize: 12, color: Colors.black54)),
                                    if (route['title'] != null) Text('${route['title']}', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 11, color: AppTheme.green)),
                                    if (item['moderation_notes'] != null) Text('${item['moderation_notes']}', maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 11, color: Colors.red)),
                                    Align(
                                      alignment: Alignment.centerRight,
                                      child: PopupMenuButton<String>(
                                        onSelected: (value) async {
                                          try {
                                            if (value == 'publish') await _requestPublication(item);
                                            if (value == 'withdraw') await _withdraw(item);
                                            if (value == 'delete') await _delete(item);
                                          } catch (error) {
                                            if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(ApiClient.instance.messageFrom(error)), backgroundColor: Colors.red));
                                          }
                                        },
                                        itemBuilder: (_) => [
                                          if (status == 'private' || status == 'rejected') const PopupMenuItem(value: 'publish', child: Text('Опубликовать')),
                                          if (status == 'pending' || status == 'published') const PopupMenuItem(value: 'withdraw', child: Text('Снять с публикации')),
                                          const PopupMenuItem(value: 'delete', child: Text('Удалить')),
                                        ],
                                      ),
                                    ),
                                  ]),
                                ),
                              ]),
                            );
                          },
                        ),
                      );
                    },
                  ),
                );
          }

'''
          media_screen = '\n'.join(line[10:] if line.startswith('          ') else line for line in media_screen.splitlines())
          mobile_path.write_text(mobile[:media_start] + media_screen + mobile[media_end:], encoding='utf-8')

          replace('mobile/lib/src/screens/enhanced_root_shell.dart',
                  "ProfileAction(icon: Icons.photo_library_outlined, title: 'Фото и видео',",
                  "ProfileAction(icon: Icons.photo_library_outlined, title: 'Паломнические фото',")

          # Help: add new user/admin sections plus CRM summary.
          help_path = Path('resources/views/site/help.blade.php')
          help_text = help_path.read_text(encoding='utf-8')
          help_text = help_text.replace(
              '<a href="#user-community"><i class="bi bi-people"></i>Сообщество</a>',
              '<a href="#user-photos"><i class="bi bi-camera"></i>Паломнические фото</a>\n                        <a href="#user-community"><i class="bi bi-people"></i>Сообщество</a>',
              1,
          )
          user_photo_section = '''
                    <div class="help-section mb-5" id="user-photos" data-help-section>
                        <div class="help-section-heading"><span class="help-role-icon"><i class="bi bi-camera"></i></span><div><div class="section-kicker">Фотолетопись</div><h2 class="h3 mb-0">Паломнические фотографии</h2></div></div>
                        <div class="accordion help-accordion" id="userPhotosAccordion">
                            <div class="accordion-item help-search-item" data-help-search="паломнические фото камера приложение галерея маршрут публикация модерация 1920 1080">
                                <h3 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#userPhotosUse" type="button">Как сохранить и опубликовать фотографию</button></h3>
                                <div class="accordion-collapse collapse show" id="userPhotosUse" data-bs-parent="#userPhotosAccordion"><div class="accordion-body">
                                    <p>В личном кабинете откройте <strong>«Паломнические фото»</strong>. На сайте выберите файл, а в мобильном приложении можно сделать снимок камерой или выбрать его из галереи.</p>
                                    <p>Фотография сначала может храниться только в личной галерее. Для общего сайта выберите опубликованный паломнический маршрут и нажмите <strong>«Отправить на публикацию»</strong>. После проверки модератором снимок появится в общей галерее и на странице маршрута.</p>
                                    <p>Крупные файлы автоматически уменьшаются пропорционально до системного предела, по умолчанию 1920×1080. Снимок не обрезается и маленькие изображения не увеличиваются.</p>
                                    <div class="help-warning">Публикуйте только собственные фотографии или материалы, на размещение которых у вас есть разрешение. Не загружайте документы, билеты и изображения с лишними персональными данными.</div>
                                </div></div>
                            </div>
                        </div>
                    </div>

'''
          marker = '                    <div class="help-section mb-5" id="user-community" data-help-section>'
          if marker not in help_text:
              raise SystemExit('User community help marker missing')
          help_text = help_text.replace(marker, user_photo_section + marker, 1)
          help_text = help_text.replace(
              '<a href="#admin-bookings"><i class="bi bi-ticket-perforated"></i>Билеты и поездки</a>',
              '<a href="#admin-crm"><i class="bi bi-kanban"></i>CRM заявок</a>\n                        <a href="#admin-bookings"><i class="bi bi-ticket-perforated"></i>Билеты и поездки</a>',
              1,
          )
          crm_help = '''
                    <div class="help-section mb-5" id="admin-crm" data-help-section>
                        <div class="help-section-heading"><span class="help-role-icon"><i class="bi bi-kanban"></i></span><div><div class="section-kicker">Обработка обращений</div><h2 class="h3 mb-0">CRM паломнических заявок</h2></div></div>
                        <div class="accordion help-accordion" id="adminCrmAccordion">
                            <div class="accordion-item help-search-item" data-help-search="crm заявки кто едет не едет участники менеджер контакт оплата задолженность отчеты ведомость csv">
                                <h3 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#adminCrmUse" type="button">Работа с заявками и составом поездки</button></h3>
                                <div class="accordion-collapse collapse show" id="adminCrmUse" data-bs-parent="#adminCrmAccordion"><div class="accordion-body">
                                    <p>В разделе <strong>«CRM заявок»</strong> обрабатываются обращения с сайта, приложения, телефона, email, VK и личного визита. Для заявки назначаются менеджер, приоритет, этап работы, следующий контакт, оплата и внутренние заметки.</p>
                                    <p>Каждый участник ведётся отдельно: не определился, едет или не едет; после поездки отмечается прибытие или неявка. Ведомость поездки можно распечатать либо выгрузить в CSV.</p>
                                    <p>Раздел отчётов показывает заявки, количество людей, подтверждения, отказы, явку, источники, суммы, оплаты и задолженность за выбранный период.</p>
                                </div></div>
                            </div>
                        </div>
                    </div>

'''
          admin_bookings_marker = '                    <div class="help-section mb-5" id="admin-bookings" data-help-section>'
          if admin_bookings_marker not in help_text:
              raise SystemExit('Admin booking help marker missing')
          help_text = help_text.replace(admin_bookings_marker, crm_help + admin_bookings_marker, 1)
          help_text = help_text.replace('Фото и видео пользователей', 'Паломнические фотографии')
          help_path.write_text(help_text, encoding='utf-8')

          # Update help test.
          replace('tests/Feature/HelpPageTest.php',
                  "            ->assertSee('Бронирования и билеты');",
                  "            ->assertSee('Бронирования и билеты')\n            ->assertSee('Паломнические фотографии');")
          replace('tests/Feature/HelpPageTest.php',
                  "            ->assertSee('Автоматическое уменьшение изображений');",
                  "            ->assertSee('Автоматическое уменьшение изображений')\n            ->assertSee('CRM паломнических заявок');")
          PY

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate backend
        run: |
          php -l app/Http/Controllers/Site/PilgrimagePhotoController.php
          php -l app/Http/Controllers/Api/V1/MobileActionController.php
          php -l app/Http/Controllers/Admin/ModerationController.php
          php -l app/Models/UserMedia.php
          php -l app/Models/PilgrimageRoute.php
          php -l routes/web.php
          php -l routes/api.php
          php -l database/migrations/2026_07_27_210000_add_publication_and_route_to_user_media_table.php
          php artisan route:list --name=profile.photos
          php artisan route:list --name=community.photos
          php artisan view:clear
          php artisan view:cache
          php artisan test --filter=PilgrimagePhotoTest
          php artisan test --filter=HelpPageTest

      - name: Validate Flutter
        working-directory: mobile
        run: |
          flutter pub get
          flutter test

      - name: Commit implementation
        run: |
          rm -f .github/workflows/add-pilgrimage-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(photos): add route-linked pilgrimage photo library"
          git push origin HEAD:main
