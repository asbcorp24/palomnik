name: Verify nearby places

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-nearby-places.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, pdo_sqlite
          coverage: none

      - name: Run verification
        shell: bash
        run: |
          set +e
          REPORT=nearby-places-verification.txt
          : > "$REPORT"

          composer install --no-interaction --prefer-dist >> "$REPORT" 2>&1
          COMPOSER=$?

          if [ "$COMPOSER" -eq 0 ]; then
            cp .env.example .env
            php artisan key:generate >> "$REPORT" 2>&1
            touch database/database.sqlite
            sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
            sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env

            php artisan migrate --force >> "$REPORT" 2>&1
            MIGRATE=$?
            php -l app/Http/Controllers/Site/ObjectController.php >> "$REPORT" 2>&1
            SITE_LINT=$?
            php -l app/Http/Controllers/Api/V1/PilgrimageObjectController.php >> "$REPORT" 2>&1
            API_LINT=$?
            php -l app/Http/Resources/PilgrimageObjectResource.php >> "$REPORT" 2>&1
            RESOURCE_LINT=$?
            php -l tests/Feature/NearbyPlacesTest.php >> "$REPORT" 2>&1
            TEST_LINT=$?
            php artisan view:cache >> "$REPORT" 2>&1
            VIEWS=$?
            php artisan test --filter=NearbyPlacesTest >> "$REPORT" 2>&1
            NEARBY_TEST=$?
            php artisan test --filter=ObjectHierarchySearchTest >> "$REPORT" 2>&1
            HIERARCHY_TEST=$?
            php artisan test --filter=FuzzyObjectSearchTest >> "$REPORT" 2>&1
            FUZZY_TEST=$?
          else
            MIGRATE=99
            SITE_LINT=99
            API_LINT=99
            RESOURCE_LINT=99
            TEST_LINT=99
            VIEWS=99
            NEARBY_TEST=99
            HIERARCHY_TEST=99
            FUZZY_TEST=99
          fi

          printf '\nRESULT composer=%s migrate=%s site_lint=%s api_lint=%s resource_lint=%s test_lint=%s views=%s nearby=%s hierarchy=%s fuzzy=%s\n' \
            "$COMPOSER" "$MIGRATE" "$SITE_LINT" "$API_LINT" "$RESOURCE_LINT" "$TEST_LINT" "$VIEWS" "$NEARBY_TEST" "$HIERARCHY_TEST" "$FUZZY_TEST" >> "$REPORT"

      - name: Commit report
        run: |
          rm -f .github/workflows/verify-nearby-places.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nearby-places-verification.txt .github/workflows/verify-nearby-places.yml
          git commit -m "test(objects): record nearby verification"
          git pull --rebase origin main
          git push origin HEAD:main
