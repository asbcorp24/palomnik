name: Verify nearby places

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-nearby-places.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare SQLite
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          php artisan migrate --force

      - name: Verify syntax and behavior
        run: |
          php -l app/Http/Controllers/Site/ObjectController.php
          php -l app/Http/Controllers/Api/V1/PilgrimageObjectController.php
          php -l app/Http/Resources/PilgrimageObjectResource.php
          php -l app/Http/Middleware/LocalizeFrontendAssets.php
          php -l tests/Feature/NearbyPlacesTest.php
          php artisan view:cache
          php artisan test --filter=NearbyPlacesTest
          php artisan test --filter=ObjectHierarchySearchTest
          php artisan test --filter=FuzzyObjectSearchTest

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/verify-nearby-places.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-nearby-places.yml
          git commit -m "test(objects): verify nearby places"
          git push origin HEAD:main
