name: Finalize local assets rebase safe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-assets-final-rebase.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Build same-origin assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/vendor-assets-final.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          Path('/tmp/vendor-assets.py').write_text(textwrap.dedent(source[start:end]),encoding='utf-8')
          PY
          python /tmp/vendor-assets.py
          python - <<'PY'
          from pathlib import Path
          for path in Path('resources/views').rglob('*.blade.php'):
              lines=path.read_text(encoding='utf-8').splitlines()
              lines=[line for line in lines if 'fonts.googleapis.com' not in line and 'fonts.gstatic.com' not in line]
              path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Verify and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          for path in Path('resources/views').rglob('*.blade.php'):
              for no,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if re.search(r'<link\b[^>]+href=["\']https?://',line,re.I) or re.search(r'<script\b[^>]+src=["\']https?://',line,re.I):
                      failures.append(f'{path}:{no}: {line.strip()}')
          required=['bootstrap/bootstrap.min.css','bootstrap/bootstrap.bundle.min.js','bootstrap-icons/bootstrap-icons.min.css','maplibre/maplibre-gl.css','maplibre/maplibre-gl.js','html5-qrcode/html5-qrcode.min.js','qrcodejs/qrcode.min.js','fonts/palomnik-fonts.css']
          for rel in required:
              if not (Path('public/vendor')/rel).is_file(): failures.append(f'Missing public/vendor/{rel}')
          for path in Path('public/vendor').rglob('*.css'):
              if re.search(r'(?:@import|url\()[^\n]*https?://',path.read_text(encoding='utf-8',errors='ignore'),re.I): failures.append(f'{path}: external URL')
          if failures: raise SystemExit('\n'.join(failures))
          PY
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan view:clear
          php artisan view:cache
          php artisan test --filter=HelpPageTest

      - name: Commit and push safely
        run: |
          rm -f .github/workflows/scan-external-assets.yml .github/workflows/vendor-external-assets.yml .github/workflows/diagnose-vendor-assets.yml .github/workflows/vendor-assets-from-source.yml .github/workflows/diagnose-vendor-source.yml .github/workflows/fix-vendor-assets-workflow.yml .github/workflows/vendor-assets-final.yml .github/workflows/diagnose-vendor-final.yml .github/workflows/vendor-assets-commit.yml .github/workflows/diagnose-vendor-commit.yml .github/workflows/vendor-assets-commit-v2.yml .github/workflows/vendor-assets-final-rebase.yml
          rm -f external-assets-report.txt vendor-npm.log vendor-copy.log vendor-assets-outcomes.txt vendor-source-download.log vendor-source-assert.log vendor-source-outcomes.txt vendor-final-download.log vendor-final-verify.log vendor-final-outcomes.txt vendor-commit-build.log vendor-commit-verify.log vendor-commit-laravel.log vendor-commit-outcomes.txt
          git checkout -- package.json 2>/dev/null || true
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): serve all CSS JavaScript and fonts locally"
          git pull --rebase origin main
          git push origin HEAD:main
