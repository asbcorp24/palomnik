name: Semantic map marker icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-marker-icons.yml'

permissions:
  contents: write

jobs:
  update-map-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch map marker data and layers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Http/Controllers/Site/MapController.php')
          text = controller.read_text(encoding='utf-8')

          old = "                'type_slug' => optional($object->objectType)->slug,\n                'marker_color' => optional($object->objectType)->marker_color ?: '#b08a3e',"
          new = "                'type_slug' => optional($object->objectType)->slug,\n                'marker_icon' => $this->objectMarkerIcon($object),\n                'marker_color' => optional($object->objectType)->marker_color ?: '#b08a3e',"
          if old not in text:
              raise SystemExit('Object map payload insertion point not found')
          text = text.replace(old, new, 1)

          marker_method = r'''
    private function objectMarkerIcon(PilgrimageObject $object): string
    {
        $type = mb_strtolower(trim(implode(' ', array_filter([
            optional($object->objectType)->slug,
            optional($object->objectType)->name,
        ]))), 'UTF-8');

        return match (true) {
            str_contains($type, 'monastery'),
            str_contains($type, 'monastyr'),
            str_contains($type, 'монастыр') => 'monastery',

            str_contains($type, 'chapel'),
            str_contains($type, 'часовн') => 'chapel',

            str_contains($type, 'source'),
            str_contains($type, 'spring'),
            str_contains($type, 'источник'),
            str_contains($type, 'купель') => 'spring',

            str_contains($type, 'temple'),
            str_contains($type, 'church'),
            str_contains($type, 'cathedral'),
            str_contains($type, 'храм'),
            str_contains($type, 'церков'),
            str_contains($type, 'собор') => 'temple',

            default => 'landmark',
        };
    }

'''
          needle = '    private function routePoints(Collection $objects): Collection\n'
          if needle not in text:
              raise SystemExit('Controller method insertion point not found')
          text = text.replace(needle, marker_method + needle, 1)
          controller.write_text(text, encoding='utf-8')

          view = Path('resources/views/site/map.blade.php')
          text = view.read_text(encoding='utf-8')

          old = "                    marker_color: item.marker_color || '#b58a32',\n                    sanctities: Array.from(item.sanctities || []).join(', '),"
          new = "                    marker_color: item.marker_color || '#b58a32',\n                    marker_icon: item.marker_icon || 'landmark',\n                    sanctities: Array.from(item.sanctities || []).join(', '),"
          if old not in text:
              raise SystemExit('Object GeoJSON insertion point not found')
          text = text.replace(old, new, 1)

          old = "                    category: item.category,\n                    marker_color: item.marker_color || '#7c3aed'"
          new = "                    category: item.category,\n                    marker_icon: item.category || 'attraction',\n                    marker_color: item.marker_color || '#7c3aed'"
          if old not in text:
              raise SystemExit('POI GeoJSON insertion point not found')
          text = text.replace(old, new, 1)

          icon_code = r'''
    function createMapIcon(iconName) {
        const size = 48;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext('2d');

        context.clearRect(0, 0, size, size);
        context.strokeStyle = '#ffffff';
        context.fillStyle = '#ffffff';
        context.lineWidth = 4;
        context.lineCap = 'round';
        context.lineJoin = 'round';

        const line = (...points) => {
            context.beginPath();
            context.moveTo(points[0], points[1]);
            for (let index = 2; index < points.length; index += 2) {
                context.lineTo(points[index], points[index + 1]);
            }
            context.stroke();
        };

        const cross = (x, y, scale = 1) => {
            line(x, y - (7 * scale), x, y + (7 * scale));
            line(x - (5 * scale), y - (2 * scale), x + (5 * scale), y - (2 * scale));
        };

        const dome = (x, y, radius = 7) => {
            context.beginPath();
            context.arc(x, y, radius, Math.PI, 0);
            context.stroke();
        };

        switch (iconName) {
            case 'temple':
                cross(24, 11, .85);
                dome(24, 25, 8);
                line(16, 25, 16, 38, 32, 38, 32, 25);
                break;

            case 'monastery':
                cross(24, 8, .65);
                dome(24, 18, 6);
                line(18, 18, 18, 37, 30, 37, 30, 18);
                dome(10, 26, 4);
                dome(38, 26, 4);
                line(6, 26, 6, 39, 42, 39, 42, 26);
                break;

            case 'chapel':
                cross(24, 12, .65);
                line(13, 26, 24, 18, 35, 26, 35, 39, 13, 39, 13, 26);
                line(24, 30, 24, 39);
                break;

            case 'spring':
                context.beginPath();
                context.moveTo(24, 7);
                context.bezierCurveTo(18, 18, 13, 25, 13, 31);
                context.bezierCurveTo(13, 39, 18, 43, 24, 43);
                context.bezierCurveTo(30, 43, 35, 39, 35, 31);
                context.bezierCurveTo(35, 25, 30, 18, 24, 7);
                context.stroke();
                break;

            case 'parking':
                context.font = '700 31px Arial, sans-serif';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText('P', 24, 25);
                break;

            case 'cafe':
                context.beginPath();
                context.rect(10, 19, 24, 15);
                context.stroke();
                context.beginPath();
                context.arc(36, 25, 7, -Math.PI / 2, Math.PI / 2);
                context.stroke();
                line(9, 39, 39, 39);
                line(15, 13, 15, 8);
                line(23, 13, 23, 8);
                break;

            case 'hotel':
                line(8, 13, 8, 39);
                line(8, 33, 41, 33);
                line(41, 24, 41, 39);
                context.beginPath();
                context.rect(13, 22, 25, 11);
                context.stroke();
                context.beginPath();
                context.arc(17, 18, 4, 0, Math.PI * 2);
                context.fill();
                break;

            case 'attraction':
                context.beginPath();
                for (let index = 0; index < 10; index++) {
                    const radius = index % 2 === 0 ? 17 : 7;
                    const angle = (-Math.PI / 2) + (index * Math.PI / 5);
                    const x = 24 + Math.cos(angle) * radius;
                    const y = 24 + Math.sin(angle) * radius;
                    index ? context.lineTo(x, y) : context.moveTo(x, y);
                }
                context.closePath();
                context.fill();
                break;

            default:
                context.beginPath();
                context.arc(24, 19, 11, 0, Math.PI * 2);
                context.stroke();
                context.beginPath();
                context.arc(24, 19, 3, 0, Math.PI * 2);
                context.fill();
                line(18, 29, 24, 42, 30, 29);
                break;
        }

        return context.getImageData(0, 0, size, size);
    }

    function registerMapIcons() {
        ['temple', 'monastery', 'chapel', 'spring', 'landmark', 'parking', 'cafe', 'hotel', 'attraction']
            .forEach(iconName => {
                const imageName = `pilgrim-${iconName}`;
                if (!map.hasImage(imageName)) {
                    map.addImage(imageName, createMapIcon(iconName), {pixelRatio: 2});
                }
            });
    }

'''
          needle = "    map.on('load', () => {\n"
          if needle not in text:
              raise SystemExit('Map load insertion point not found')
          text = text.replace(needle, icon_code + needle + "        registerMapIcons();\n", 1)

          old = "                'circle-radius':9,\n                'circle-stroke-width':3,"
          new = "                'circle-radius':13,\n                'circle-stroke-width':3,"
          if old not in text:
              raise SystemExit('Object circle radius not found')
          text = text.replace(old, new, 1)

          object_icon_layer = r'''

        map.addLayer({
            id:'pilgrim-point-icons',
            type:'symbol',
            source:'pilgrim-objects',
            filter:['!', ['has','point_count']],
            layout:{
                'icon-image':['concat','pilgrim-',['coalesce',['get','marker_icon'],'landmark']],
                'icon-size':1,
                'icon-allow-overlap':true,
                'icon-ignore-placement':true
            }
        });
'''
          needle = "        map.addSource('points-of-interest', {\n"
          if needle not in text:
              raise SystemExit('POI source insertion point not found')
          text = text.replace(needle, object_icon_layer + "\n" + needle, 1)

          old = "                'circle-radius':7,\n                'circle-stroke-width':2.5,"
          new = "                'circle-radius':11,\n                'circle-stroke-width':2.5,"
          if old not in text:
              raise SystemExit('POI circle radius not found')
          text = text.replace(old, new, 1)

          poi_icon_layer = r'''

        map.addLayer({
            id:'point-of-interest-icons',
            type:'symbol',
            source:'points-of-interest',
            layout:{
                'icon-image':['concat','pilgrim-',['coalesce',['get','marker_icon'],'attraction']],
                'icon-size':.86,
                'icon-allow-overlap':true,
                'icon-ignore-placement':true
            }
        });
'''
          needle = "        if (satelliteUrl) {\n"
          if needle not in text:
              raise SystemExit('Satellite insertion point not found')
          text = text.replace(needle, poi_icon_layer + "\n" + needle, 1)

          old = "    ['pilgrim-clusters','pilgrim-points','points-of-interest'].forEach(layer => {"
          new = "    ['pilgrim-clusters','pilgrim-points','pilgrim-point-icons','points-of-interest','point-of-interest-icons'].forEach(layer => {"
          if old not in text:
              raise SystemExit('Cursor layers list not found')
          text = text.replace(old, new, 1)

          old = "        if (!map.getLayer('points-of-interest')) return;\n        const selected = Array.from(document.querySelectorAll('[data-poi-category]:checked')).map(item => item.value);\n        map.setFilter(\n            'points-of-interest',\n            selected.length\n                ? ['in', ['get','category'], ['literal', selected]]\n                : ['==', ['get','category'], '__none__']\n        );"
          new = "        if (!map.getLayer('points-of-interest')) return;\n        const selected = Array.from(document.querySelectorAll('[data-poi-category]:checked')).map(item => item.value);\n        const filter = selected.length\n            ? ['in', ['get','category'], ['literal', selected]]\n            : ['==', ['get','category'], '__none__'];\n        map.setFilter('points-of-interest', filter);\n        if (map.getLayer('point-of-interest-icons')) map.setFilter('point-of-interest-icons', filter);"
          if old not in text:
              raise SystemExit('POI category filter block not found')
          text = text.replace(old, new, 1)

          view.write_text(text, encoding='utf-8')
          PY

      - name: Add feature test
        run: |
          cat > tests/Feature/MapMarkerIconTest.php <<'PHP'
          <?php

          namespace Tests\Feature;

          use App\Models\ObjectType;
          use App\Models\PilgrimageObject;
          use App\Models\PointOfInterest;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Tests\TestCase;

          class MapMarkerIconTest extends TestCase
          {
              use RefreshDatabase;

              public function test_map_assigns_semantic_icons_to_objects_and_points_of_interest(): void
              {
                  $monasteryType = ObjectType::query()->create([
                      'name' => 'Монастырь',
                      'slug' => 'monastery',
                      'marker_color' => '#26443b',
                      'sort_order' => 1,
                  ]);

                  $object = PilgrimageObject::query()->create([
                      'object_type_id' => $monasteryType->id,
                      'name' => 'Тестовый монастырь',
                      'slug' => 'test-monastery',
                      'address' => 'Москва',
                      'latitude' => 55.75,
                      'longitude' => 37.61,
                      'is_published' => true,
                      'published_at' => now()->subMinute(),
                  ]);

                  PointOfInterest::query()->create([
                      'pilgrimage_object_id' => $object->id,
                      'category' => 'parking',
                      'name' => 'Стоянка',
                      'latitude' => 55.751,
                      'longitude' => 37.611,
                      'is_published' => true,
                  ]);

                  $this->get(route('map'))
                      ->assertOk()
                      ->assertSee('"marker_icon":"monastery"', false)
                      ->assertSee('"marker_icon":"parking"', false)
                      ->assertSee("id:'pilgrim-point-icons'", false)
                      ->assertSee("id:'point-of-interest-icons'", false);
              }
          }
          PHP

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Verify Laravel and map icons
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php -l app/Http/Controllers/Site/MapController.php
          php artisan view:cache
          php artisan test --filter=MapMarkerIconTest

      - name: Commit changes
        run: |
          rm -f .github/workflows/map-marker-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(map): add semantic icons for map markers"
          git push origin HEAD:main
