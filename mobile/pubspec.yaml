name: moscow_pilgrim
publish_to: none
description: Мобильное приложение пользовательской части платформы «Московский паломник».
version: 0.4.2+6

environment:
  sdk: '>=3.10.0 <4.0.0'

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/images/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  maplibre_gl: ^0.25.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
