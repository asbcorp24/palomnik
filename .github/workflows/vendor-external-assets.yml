name: Vendor external frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-external-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install pinned frontend packages
        run: |
          npm install --save-exact \
            bootstrap@5.3.3 \
            bootstrap-icons@1.11.3 \
            html5-qrcode@2.3.8 \
            qrcodejs@1.0.0 \
            maplibre-gl@5 \
            @fontsource/inter \
            @fontsource/prata \
            @fontsource/nunito

      - name: Copy distributable assets and rewrite templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          public = root / 'public' / 'vendor'

          def reset_dir(path: Path):
              if path.exists():
                  shutil.rmtree(path)
              path.mkdir(parents=True, exist_ok=True)

          def copy_file(source: str, destination: str, required: bool = True):
              src = root / source
              dst = root / destination
              if not src.exists():
                  if required:
                      raise SystemExit(f'Missing required asset: {src}')
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          # Bootstrap.
          reset_dir(public / 'bootstrap')
          for name in ['bootstrap.min.css', 'bootstrap.min.css.map']:
              copy_file(f'node_modules/bootstrap/dist/css/{name}', f'public/vendor/bootstrap/{name}')
          for name in ['bootstrap.bundle.min.js', 'bootstrap.bundle.min.js.map']:
              copy_file(f'node_modules/bootstrap/dist/js/{name}', f'public/vendor/bootstrap/{name}')
          copy_file('node_modules/bootstrap/LICENSE', 'public/vendor/bootstrap/LICENSE.txt')

          # Bootstrap Icons with local font files.
          reset_dir(public / 'bootstrap-icons')
          copy_file('node_modules/bootstrap-icons/font/bootstrap-icons.min.css', 'public/vendor/bootstrap-icons/bootstrap-icons.min.css')
          shutil.copytree(
              root / 'node_modules/bootstrap-icons/font/fonts',
              public / 'bootstrap-icons/fonts',
          )
          copy_file('node_modules/bootstrap-icons/LICENSE.md', 'public/vendor/bootstrap-icons/LICENSE.md')

          # MapLibre GL.
          reset_dir(public / 'maplibre')
          for name in ['maplibre-gl.css', 'maplibre-gl.js', 'maplibre-gl.js.map']:
              copy_file(f'node_modules/maplibre-gl/dist/{name}', f'public/vendor/maplibre/{name}', required=name != 'maplibre-gl.js.map')
          copy_file('node_modules/maplibre-gl/LICENSE.txt', 'public/vendor/maplibre/LICENSE.txt', required=False)
          copy_file('node_modules/maplibre-gl/LICENSE', 'public/vendor/maplibre/LICENSE.txt', required=False)

          # QR scanner and ticket QR generator.
          reset_dir(public / 'html5-qrcode')
          copy_file('node_modules/html5-qrcode/html5-qrcode.min.js', 'public/vendor/html5-qrcode/html5-qrcode.min.js')
          copy_file('node_modules/html5-qrcode/LICENSE', 'public/vendor/html5-qrcode/LICENSE.txt', required=False)

          reset_dir(public / 'qrcodejs')
          copy_file('node_modules/qrcodejs/qrcode.min.js', 'public/vendor/qrcodejs/qrcode.min.js')
          copy_file('node_modules/qrcodejs/LICENSE', 'public/vendor/qrcodejs/LICENSE.txt', required=False)

          # Self-hosted fonts. Copy only CSS used by the application and the font files referenced by it.
          reset_dir(public / 'fonts')
          font_specs = {
              'inter': ['400.css', '500.css', '600.css', '700.css'],
              'prata': ['400.css'],
              'nunito': ['400.css', '600.css', '700.css'],
          }
          imports = []
          url_pattern = re.compile(r'url\((?:["\']?)(\.\/files\/[^)"\']+)(?:["\']?)\)')

          for family, css_files in font_specs.items():
              source_dir = root / 'node_modules' / '@fontsource' / family
              destination_dir = public / 'fonts' / family
              (destination_dir / 'files').mkdir(parents=True, exist_ok=True)

              for css_name in css_files:
                  source_css = source_dir / css_name
                  if not source_css.exists():
                      raise SystemExit(f'Missing font stylesheet: {source_css}')
                  css_text = source_css.read_text(encoding='utf-8')
                  (destination_dir / css_name).write_text(css_text, encoding='utf-8')
                  imports.append(f"@import url('./{family}/{css_name}');")

                  for relative in url_pattern.findall(css_text):
                      font_name = Path(relative).name
                      source_font = source_dir / 'files' / font_name
                      if not source_font.exists():
                          raise SystemExit(f'Missing font file: {source_font}')
                      shutil.copy2(source_font, destination_dir / 'files' / font_name)

              for license_name in ['LICENSE', 'LICENSE.md']:
                  source_license = source_dir / license_name
                  if source_license.exists():
                      shutil.copy2(source_license, destination_dir / license_name)
                      break

          (public / 'fonts' / 'palomnik-fonts.css').write_text('\n'.join(imports) + '\n', encoding='utf-8')

          replacements = {
              'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prata&display=swap': "{{ asset('vendor/fonts/palomnik-fonts.css') }}",
              'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap': "{{ asset('vendor/fonts/palomnik-fonts.css') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css': "{{ asset('vendor/bootstrap/bootstrap.min.css') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js': "{{ asset('vendor/bootstrap/bootstrap.bundle.min.js') }}",
              'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css': "{{ asset('vendor/bootstrap-icons/bootstrap-icons.min.css') }}",
              'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js': "{{ asset('vendor/html5-qrcode/html5-qrcode.min.js') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css': "{{ asset('vendor/maplibre/maplibre-gl.css') }}",
              'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js': "{{ asset('vendor/maplibre/maplibre-gl.js') }}",
              'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js': "{{ asset('vendor/qrcodejs/qrcode.min.js') }}",
          }

          for path in (root / 'resources' / 'views').rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'^\s*<link\s+rel=["\']preconnect["\']\s+href=["\']https://fonts\.(?:googleapis|gstatic)\.com["\'](?:\s+crossorigin)?\s*>\s*\n?', '', text, flags=re.I | re.M)
              for source, target in replacements.items():
                  text = text.replace(source, target)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Cache same-origin vendor files on first use and pre-cache the shared application shell.
          sw_path = root / 'public' / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const CACHE_VERSION = 'palomnik-v3';", "const CACHE_VERSION = 'palomnik-v4';")
          sw = sw.replace(
              "  '/css/pilgrim-account.css',\n  '/manifest.webmanifest',",
              "  '/css/pilgrim-account.css',\n  '/vendor/fonts/palomnik-fonts.css',\n  '/vendor/bootstrap/bootstrap.min.css',\n  '/vendor/bootstrap/bootstrap.bundle.min.js',\n  '/vendor/bootstrap-icons/bootstrap-icons.min.css',\n  '/manifest.webmanifest',",
          )
          sw = sw.replace(
              "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/icons/')",
              "  if (url.pathname.startsWith('/css/')\n      || url.pathname.startsWith('/js/')\n      || url.pathname.startsWith('/vendor/')\n      || url.pathname.startsWith('/icons/')",
          )
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Assert there are no externally hosted CSS or JavaScript files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'<link\b[^>]*?href=["\']https?://[^"\']+["\'][^>]*>', re.I),
              re.compile(r'<script\b[^>]*?src=["\']https?://[^"\']+["\'][^>]*>', re.I),
              re.compile(r'@import\s+(?:url\()?\s*["\']?https?://', re.I),
          ]
          failures = []
          for root in [Path('resources'), Path('public')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php', '.css', '.js', '.html'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if any(pattern.search(line) for pattern in patterns):
                          failures.append(f'{path}:{lineno}: {line.strip()}')
          if failures:
              raise SystemExit('External assets remain:\n' + '\n'.join(failures))
          print('All stylesheet and script assets are served locally.')
          PY

      - name: Validate Laravel views
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan view:clear
          php artisan view:cache
          php artisan test --filter=HelpPageTest

      - name: Commit local assets
        run: |
          rm -f .github/workflows/scan-external-assets.yml .github/workflows/vendor-external-assets.yml external-assets-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): serve all CSS JavaScript and fonts locally"
          git push origin HEAD:main
