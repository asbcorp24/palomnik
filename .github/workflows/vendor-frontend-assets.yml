name: Vendor frontend assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-frontend-assets.yml'

permissions:
  contents: write

jobs:
  vendor-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download frontend dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/assets/vendor/bootstrap
          mkdir -p public/assets/vendor/bootstrap-icons/fonts
          mkdir -p public/assets/vendor/maplibre
          mkdir -p public/assets/vendor/html5-qrcode
          mkdir -p public/assets/vendor/qrcodejs

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' \
            --output public/assets/vendor/bootstrap/bootstrap.min.css

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js' \
            --output public/assets/vendor/bootstrap/bootstrap.bundle.min.js

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css' \
            --output public/assets/vendor/bootstrap-icons/bootstrap-icons.min.css

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2?dd67030699838ea613ee6dbda90effa6' \
            --output public/assets/vendor/bootstrap-icons/fonts/bootstrap-icons.woff2

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff?dd67030699838ea613ee6dbda90effa6' \
            --output public/assets/vendor/bootstrap-icons/fonts/bootstrap-icons.woff

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' \
            --output public/assets/vendor/maplibre/maplibre-gl.css

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js' \
            --output public/assets/vendor/maplibre/maplibre-gl.js

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js' \
            --output public/assets/vendor/html5-qrcode/html5-qrcode.min.js

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js' \
            --output public/assets/vendor/qrcodejs/qrcode.min.js

          test "$(wc -c < public/assets/vendor/bootstrap/bootstrap.min.css)" -gt 100000
          test "$(wc -c < public/assets/vendor/bootstrap/bootstrap.bundle.min.js)" -gt 50000
          test "$(wc -c < public/assets/vendor/bootstrap-icons/bootstrap-icons.min.css)" -gt 50000
          test "$(wc -c < public/assets/vendor/bootstrap-icons/fonts/bootstrap-icons.woff2)" -gt 50000
          test "$(wc -c < public/assets/vendor/maplibre/maplibre-gl.js)" -gt 500000

          grep -q 'fonts/bootstrap-icons.woff2' public/assets/vendor/bootstrap-icons/bootstrap-icons.min.css

      - name: Commit vendor assets
        run: |
          rm -f .github/workflows/vendor-frontend-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/vendor .github/workflows/vendor-frontend-assets.yml
          git commit -m "fix(assets): commit frontend vendor files"
          git push origin HEAD:main
