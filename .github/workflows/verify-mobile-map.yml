name: Verify mobile map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-mobile-map.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Check formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib/src/core/api_client.dart lib/src/screens/maplibre_map.dart lib/src/screens/user_features.dart lib/src/widgets/pilgrim_map_marker.dart

      - name: Analyze application
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Verify website map JavaScript
        run: |
          node --check public/js/together-chat.js
          node --check public/sw.js
          grep -q "this.moveLayer(primaryLayerId)" public/js/together-chat.js

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/verify-mobile-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-mobile-map.yml
          git commit -m "test(mobile): verify synchronized maps"
          git push origin HEAD:main
