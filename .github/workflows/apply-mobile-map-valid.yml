name: Apply valid mobile map patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-map-valid.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply prepared patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/mobile-map-patch.py
          python3 /tmp/mobile-map-patch.py

      - name: Verify patch
        run: |
          node --check public/js/together-chat.js
          node --check public/sw.js
          grep -q "List<Map<String, dynamic>> _pointsOfInterest" mobile/lib/src/screens/maplibre_map.dart
          grep -q "WidgetLayer" mobile/lib/src/screens/maplibre_map.dart
          grep -q "class ObjectMiniMap" mobile/lib/src/screens/user_features.dart
          grep -q "path == '/points-of-interest'" mobile/lib/src/core/api_client.dart
          grep -q "this.moveLayer(primaryLayerId)" public/js/together-chat.js

      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-mobile-map-valid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(mobile): sync maps with website"
          git push origin HEAD:main
