name: PHP and JavaScript syntax

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Lint map JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/map-viewport.js
          node --check public/js/map-enhancements.js
          node --check public/js/map-religious-icons.js
          node --check public/js/map-focused-points.js
