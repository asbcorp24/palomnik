name: Diagnose frontend asset vendoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-vendor-assets.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages and capture log
        id: npm
        continue-on-error: true
        run: |
          npm install --save-exact bootstrap@5.3.3 bootstrap-icons@1.11.3 html5-qrcode@2.3.8 qrcodejs@1.0.0 maplibre-gl@5 @fontsource/inter @fontsource/prata @fontsource/nunito > vendor-npm.log 2>&1

      - name: Run asset copy script and capture log
        id: copy
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/vendor-external-assets.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          Path('/tmp/vendor-assets.py').write_text(textwrap.dedent(source[start:end]), encoding='utf-8')
          PY
          python /tmp/vendor-assets.py > vendor-copy.log 2>&1

      - name: Record diagnostic result
        run: |
          cat > vendor-assets-outcomes.txt <<EOF
          npm=${{ steps.npm.outcome }}
          copy=${{ steps.copy.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor-npm.log vendor-copy.log vendor-assets-outcomes.txt
          git commit -m "ci: record frontend asset vendoring diagnostics"
          git push origin HEAD:main
