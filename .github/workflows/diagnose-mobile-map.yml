name: Diagnose mobile map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mobile-map.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          REPORT=mobile/verification-report.txt
          : > "$REPORT"

          cd mobile
          flutter --version >> verification-report.txt 2>&1

          flutter pub get >> verification-report.txt 2>&1
          PUB_STATUS=$?

          dart format lib/src/core/api_client.dart lib/src/screens/maplibre_map.dart lib/src/screens/user_features.dart lib/src/widgets/pilgrim_map_marker.dart >> verification-report.txt 2>&1
          FORMAT_STATUS=$?

          flutter analyze >> verification-report.txt 2>&1
          ANALYZE_STATUS=$?

          flutter test >> verification-report.txt 2>&1
          TEST_STATUS=$?

          printf '\nRESULT pub_get=%s format=%s analyze=%s test=%s\n' "$PUB_STATUS" "$FORMAT_STATUS" "$ANALYZE_STATUS" "$TEST_STATUS" >> verification-report.txt
          cd ..

          node --check public/js/together-chat.js >> "$REPORT" 2>&1
          WEB_JS_STATUS=$?
          node --check public/sw.js >> "$REPORT" 2>&1
          SW_STATUS=$?
          printf 'RESULT web_js=%s service_worker=%s\n' "$WEB_JS_STATUS" "$SW_STATUS" >> "$REPORT"

      - name: Commit diagnostic result
        run: |
          rm -f .github/workflows/diagnose-mobile-map.yml
          rm -f .github/workflows/verify-mobile-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mobile .github/workflows/diagnose-mobile-map.yml .github/workflows/verify-mobile-map.yml
          git commit -m "test(mobile): record map verification"
          git push origin HEAD:main
