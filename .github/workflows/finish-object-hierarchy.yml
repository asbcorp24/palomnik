name: Finish object hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-object-hierarchy.yml'

permissions:
  contents: write

jobs:
  finish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply final hierarchy changes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/finish-object-hierarchy.py
          python3 /tmp/finish-object-hierarchy.py

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          php artisan migrate --force

      - name: Verify Laravel behavior
        run: |
          php -l app/Http/Controllers/Admin/PilgrimageObjectController.php
          php -l app/Http/Controllers/Site/ObjectController.php
          php -l app/Http/Controllers/Api/V1/PilgrimageObjectController.php
          php -l app/Http/Resources/PilgrimageObjectResource.php
          php artisan view:cache
          php artisan test --filter=ObjectHierarchyAndNearbyTest
          php artisan test --filter=FuzzyObjectSearchTest

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter detail screen
        working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/src/screens/user_features.dart
          flutter analyze
          flutter test

      - name: Commit final implementation
        run: |
          rm -f .github/workflows/finish-object-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(objects): finish hierarchy and nearby places"
          git push origin HEAD:main
