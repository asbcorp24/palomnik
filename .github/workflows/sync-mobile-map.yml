      - name: Verify Flutter application
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/src/core/api_client.dart lib/src/screens/maplibre_map.dart lib/src/screens/user_features.dart lib/src/widgets/pilgrim_map_marker.dart
          flutter analyze
          flutter test

      - name: Verify website JavaScript
        run: |
          node --check public/js/together-chat.js
          node --check public/sw.js
          grep -q "this.moveLayer(primaryLayerId)" public/js/together-chat.js
          grep -q "palomnik-v4" public/sw.js
