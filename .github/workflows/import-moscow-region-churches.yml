name: Import Moscow region Orthodox places

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-moscow-region-churches.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, fileinfo, gd, pdo_sqlite
          coverage: none

      - name: Add importer, migration and seeder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts database/seeders/data docs tests/Feature

          cat > scripts/fetch_moscow_region_churches.py <<'PY'
          #!/usr/bin/env python3
          import json
          import math
          import re
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ENDPOINTS = [
              'https://overpass.kumi.systems/api/interpreter',
              'https://overpass-api.de/api/interpreter',
              'https://overpass.private.coffee/api/interpreter',
          ]
          REGIONS = [
              ('RU-MOW', 'Москва'),
              ('RU-MOS', 'Московская область'),
          ]
          OUTPUT = Path('database/seeders/data/moscow-region-orthodox-places.json')
          NAME_PATTERN = re.compile(
              r'(храм|церков|собор|часовн|монастыр|подворье|пустынь|church|cathedral|chapel|monastery)',
              re.IGNORECASE,
          )
          NON_ORTHODOX = {
              'roman_catholic', 'catholic', 'protestant', 'lutheran', 'baptist',
              'evangelical', 'pentecostal', 'methodist', 'adventist',
              'seventh_day_adventist', 'jehovahs_witness', 'mormon',
              'new_apostolic', 'armenian_apostolic', 'anglican', 'presbyterian',
              'reformed', 'quaker', 'unitarian', 'mennonite',
          }
          LIFECYCLE_PREFIXES = ('abandoned:', 'disused:', 'demolished:', 'razed:')

          def overpass_query(iso_code: str) -> str:
              return f'''[out:json][timeout:900][maxsize:1073741824];
          area["ISO3166-2"="{iso_code}"]["boundary"="administrative"]->.region;
          (
            nwr(area.region)["amenity"~"^(place_of_worship|monastery)$"];
            nwr(area.region)["building"~"^(church|cathedral|chapel|monastery)$"];
          );
          out center tags qt;'''

          def fetch_region(iso_code: str) -> dict:
              payload = urllib.parse.urlencode({'data': overpass_query(iso_code)}).encode('utf-8')
              last_error = None
              for endpoint in ENDPOINTS:
                  for attempt in range(3):
                      try:
                          request = urllib.request.Request(
                              endpoint,
                              data=payload,
                              headers={
                                  'User-Agent': 'MoscowPilgrimSeeder/1.0 (+https://github.com/asbcorp24/palomnik)',
                                  'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                              },
                              method='POST',
                          )
                          with urllib.request.urlopen(request, timeout=960) as response:
                              return json.loads(response.read().decode('utf-8'))
                      except Exception as exc:
                          last_error = exc
                          time.sleep(5 * (attempt + 1))
              raise RuntimeError(f'Overpass request failed for {iso_code}: {last_error}')

          def text(tags: dict, *keys: str):
              for key in keys:
                  value = tags.get(key)
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return None

          def normalize(value: str) -> str:
              value = unicodedata.normalize('NFKC', value).casefold().replace('ё', 'е')
              return re.sub(r'[^a-zа-я0-9]+', ' ', value).strip()

          def coordinates(element: dict):
              if element.get('lat') is not None and element.get('lon') is not None:
                  return float(element['lat']), float(element['lon'])
              center = element.get('center') or {}
              if center.get('lat') is not None and center.get('lon') is not None:
                  return float(center['lat']), float(center['lon'])
              return None

          def is_active(tags: dict) -> bool:
              if any(key.startswith(LIFECYCLE_PREFIXES) for key in tags):
                  if tags.get('amenity') not in {'place_of_worship', 'monastery'}:
                      return False
              if tags.get('construction') or tags.get('building') == 'construction':
                  return False
              if tags.get('ruins') == 'yes' or tags.get('historic') == 'ruins':
                  return False
              return True

          def is_orthodox_candidate(tags: dict, name: str) -> bool:
              religion = (tags.get('religion') or '').strip().casefold()
              if religion and religion != 'christian':
                  return False
              denomination = (tags.get('denomination') or '').strip().casefold()
              if denomination in NON_ORTHODOX:
                  return False
              building = (tags.get('building') or '').strip().casefold()
              amenity = (tags.get('amenity') or '').strip().casefold()
              if denomination in {'orthodox', 'russian_orthodox', 'eastern_orthodox', 'old_believers'}:
                  return True
              if building in {'church', 'cathedral', 'chapel', 'monastery'}:
                  return True
              if amenity == 'monastery':
                  return True
              return bool(NAME_PATTERN.search(name))

          def infer_type(tags: dict, name: str) -> str:
              haystack = normalize(' '.join(filter(None, [name, tags.get('building'), tags.get('amenity'), tags.get('place')])))
              if 'монастыр' in haystack or 'monastery' in haystack or tags.get('amenity') == 'monastery':
                  return 'monastery'
              if 'часовн' in haystack or 'chapel' in haystack or tags.get('building') == 'chapel':
                  return 'chapel'
              return 'temple'

          def address(tags: dict, region_name: str) -> str:
              full = text(tags, 'addr:full')
              if full:
                  return full
              parts = []
              for value in [
                  text(tags, 'addr:region') or region_name,
                  text(tags, 'addr:city', 'addr:town', 'addr:village', 'addr:place'),
                  text(tags, 'addr:suburb', 'addr:district'),
                  text(tags, 'addr:street'),
              ]:
                  if value and value not in parts:
                      parts.append(value)
              house = text(tags, 'addr:housenumber')
              if house:
                  if parts:
                      parts[-1] = f'{parts[-1]}, {house}'
                  else:
                      parts.append(house)
              return ', '.join(parts) if parts else region_name

          def schedule(tags: dict):
              values = []
              service = text(tags, 'service_times')
              opening = text(tags, 'opening_hours')
              if service:
                  values.append(f'Богослужения: {service}')
              if opening:
                  values.append(f'Часы работы: {opening}')
              return '\n'.join(values) or None

          def haversine(a, b) -> float:
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat, dlon = lat2 - lat1, lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.atan2(math.sqrt(h), math.sqrt(1 - h))

          def richness(item: dict) -> int:
              fields = ('address', 'phone', 'email', 'website', 'schedule_text')
              return sum(1 for field in fields if item.get(field)) + (2 if item['osm_type'] != 'node' else 0)

          all_items = []
          raw_counts = {}
          skipped = {'unnamed': 0, 'inactive': 0, 'non_orthodox': 0, 'no_coordinates': 0, 'duplicates': 0}

          for iso_code, region_name in REGIONS:
              payload = fetch_region(iso_code)
              raw_counts[iso_code] = len(payload.get('elements', []))
              for element in payload.get('elements', []):
                  tags = element.get('tags') or {}
                  name = text(tags, 'name:ru', 'name')
                  if not name:
                      skipped['unnamed'] += 1
                      continue
                  if not is_active(tags):
                      skipped['inactive'] += 1
                      continue
                  if not is_orthodox_candidate(tags, name):
                      skipped['non_orthodox'] += 1
                      continue
                  point = coordinates(element)
                  if point is None:
                      skipped['no_coordinates'] += 1
                      continue
                  osm_type = element['type']
                  osm_id = int(element['id'])
                  all_items.append({
                      'source_id': f'{osm_type}/{osm_id}',
                      'osm_type': osm_type,
                      'osm_id': osm_id,
                      'source_url': f'https://www.openstreetmap.org/{osm_type}/{osm_id}',
                      'region': region_name,
                      'type': infer_type(tags, name),
                      'name': name,
                      'address': address(tags, region_name),
                      'latitude': round(point[0], 7),
                      'longitude': round(point[1], 7),
                      'phone': text(tags, 'contact:phone', 'phone'),
                      'email': text(tags, 'contact:email', 'email'),
                      'website': text(tags, 'contact:website', 'website'),
                      'schedule_text': schedule(tags),
                  })

          # Remove duplicate node/building pairs with the same normalized name and type nearby.
          deduplicated = []
          for item in sorted(all_items, key=lambda value: (-richness(value), value['source_id'])):
              duplicate = None
              key = (item['type'], normalize(item['name']))
              for existing in deduplicated:
                  if (existing['type'], normalize(existing['name'])) != key:
                      continue
                  if haversine(
                      (item['latitude'], item['longitude']),
                      (existing['latitude'], existing['longitude']),
                  ) <= 80:
                      duplicate = existing
                      break
              if duplicate is None:
                  deduplicated.append(item)
              else:
                  skipped['duplicates'] += 1

          deduplicated.sort(key=lambda value: (value['region'], value['type'], normalize(value['name']), value['source_id']))
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps({
              'meta': {
                  'generated_at': datetime.now(timezone.utc).isoformat(),
                  'source': 'OpenStreetMap contributors via Overpass API',
                  'license': 'ODbL 1.0',
                  'regions': [region[0] for region in REGIONS],
                  'raw_counts': raw_counts,
                  'imported_count': len(deduplicated),
                  'skipped': skipped,
              },
              'objects': deduplicated,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Wrote {len(deduplicated)} objects to {OUTPUT}')
          PY
          chmod +x scripts/fetch_moscow_region_churches.py

          cat > database/migrations/2026_07_31_143000_add_external_source_to_pilgrimage_objects_table.php <<'PHP'
          <?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Database\Schema\Blueprint;
          use Illuminate\Support\Facades\Schema;

          return new class extends Migration
          {
              public function up(): void
              {
                  Schema::table('pilgrimage_objects', function (Blueprint $table) {
                      $table->string('source', 32)->nullable()->after('parent_object_id');
                      $table->string('source_id', 96)->nullable()->after('source');
                      $table->unique(['source', 'source_id'], 'pilgrimage_objects_source_unique');
                  });
              }

              public function down(): void
              {
                  Schema::table('pilgrimage_objects', function (Blueprint $table) {
                      $table->dropUnique('pilgrimage_objects_source_unique');
                      $table->dropColumn(['source', 'source_id']);
                  });
              }
