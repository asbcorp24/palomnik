name: Fix vendor assets workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vendor-assets-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make optional license download non-blocking
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/vendor-assets-from-source.yml')
          text = path.read_text(encoding='utf-8')
          old = "          save('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/LICENSE.md', icons / 'LICENSE.md')\n"
          new = "          try:\n              save('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/LICENSE', icons / 'LICENSE.txt')\n          except Exception:\n              pass\n"
          if old not in text:
              raise SystemExit('Bootstrap Icons license line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/vendor-assets-from-source.yml
          git commit -m "ci: make vendor license downloads optional"
          git push origin HEAD:main
