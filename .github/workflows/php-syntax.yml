name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
